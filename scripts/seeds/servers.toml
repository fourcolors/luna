# /etc/luna/servers.toml — SERVER OPERATOR REGISTRY (seed template).
#
# PRODUCTION DEPLOYMENT:
#   sudo install -m 0600 -o root -g root scripts/seeds/servers.toml /etc/luna/servers.toml
#
# This file must be mode 0600, root-owned.
# luna-registry.sh REFUSES to load it if group/world-writable (& 0022 != 0).
#
# The loader also hard-fails if kind != "registry".
#
# Phase 1b: stable has been flipped to its REAL runtime — the luna-stable incus
# container. This was empirically verified (1b.1 gate): `incus list` shows
# luna-stable RUNNING; host luna-chat-server.service is INACTIVE; the in-container
# unit is ACTIVE; host :4753 is an incusd proxy into the container's bun process;
# /root/luna/stable/repo is bind-mounted to the container's /root/luna.
# The previous bare-host stanza was the P_INCUS="" bug class — now corrected.

kind          = "registry"
schemaVersion = 1
host          = "luna-host"

# ─────────────────────────────────────────────────────────────────────────────
# stable — production daily driver.
# RUNTIME: incus container luna-stable (empirically verified 1b.1, 2026-06-22).
#   - Host repo /root/luna/stable/repo bind-mounted to container /root/luna
#   - Service runs INSIDE the container (luna-chat-server.service)
#   - Host :4753 is an incusd proxy into the container's bun process
#   - Host luna-chat-server.service is INACTIVE (not a bare-host deploy)
# ─────────────────────────────────────────────────────────────────────────────
[[server]]
name        = "stable"
description = "Production chat-server (daily driver)"
enabled     = true

# update.params.hostRepoDir → P_REPO (bind-mounted host-side repo path)
update.params.hostRepoDir         = "/root/luna/stable/repo"
# update.params.ref → P_BRANCH = "master" (after stripping "origin/")
update.params.ref                 = "origin/master"
# Incus container name → P_INCUS (non-empty → --incus flag in P_UPDATE_ARGS)
runtime.target.incus.container    = "luna-stable"
# containerRepoDir: DOCUMENTARY ONLY — records the in-container bind-mount target
# of hostRepoDir for humans. The current engine hardcodes /root/luna and does NOT
# read this key (reserved for the Phase-4 TS engine).
runtime.target.incus.containerRepoDir = "/root/luna"

# Health / WS port
ports.proxy = 4753

# Guardian: ON BY DEFAULT (owner decision 2026-07). Its health timer runs even
# when branch movement is disabled; updates only restart when origin/master
# moved AND (no WebSocket sessions are active, OR standing sessions have aged
# past deploy.maxSessionDefer). Set deploy.autoUpdate=false to keep
# health/repair but disable updates, or `luna-guardian uninstall stable`
# to remove the control plane. Manual `luna-autodeploy stable` always works.
deploy.timer         = true
deploy.timerInterval = "15min"
deploy.autoUpdate    = true
deploy.trackBranch   = "master"
# Cap standing-session deferral so a daily-driver Moon (hub+chat sockets) cannot
# starve origin/master forever. Absent key = 4h. "0" / "infinity" = classic
# forever-defer. Logged as staleness, never as an operator override.
deploy.maxSessionDefer = "4h"

# ─────────────────────────────────────────────────────────────────────────────
# dev — auto-deployed on a timer via incus container luna-dev.
# RUNTIME: incus — matches today's P_INCUS="luna-dev" in profile_config().
# ─────────────────────────────────────────────────────────────────────────────
[[server]]
name        = "dev"
description = "Dev chat-server (auto-deployed on a timer)"
enabled     = true

update.params.hostRepoDir         = "/root/luna/dev/repo"
update.params.ref                 = "origin/dev"
# Incus container name → P_INCUS (non-empty → --incus flag in P_UPDATE_ARGS)
runtime.target.incus.container    = "luna-dev"

ports.proxy = 4753

deploy.timer         = true
deploy.timerInterval = "3min"
deploy.autoUpdate    = true
deploy.trackBranch   = "dev"
deploy.maxSessionDefer = "4h"
