<!--
  feedback-queue — Phase 1 on-demand triage view for point-at-the-UI
  feedback (Task 37 / decision 20).

  Served as the ui://luna/feedback-queue resource
  (text/html;profile=mcp-app), a STATIC core app exactly like
  workspace-pulse.html — same raw MCP Apps JSON-RPC 2.0 handshake over
  postMessage (SEP-1865), no SDK bundle, no network (host sandbox CSP
  forbids it).

  Why a static core app and NOT a runtime `mcp_app_write` artifact (the
  orchestrating decision for this PR, recorded in the PR body / decision
  ledger):
    1. An `mcp_app_write` artifact created against the CURRENT pre-deploy
       server would reference tools (`feedback-list`/`feedback-set-status`)
       that don't exist yet on that server — broken until deploy, and
       creating the artifact live is a post-merge action, not something that
       belongs in a PR diff.
    2. A static core app ships FULLY in this PR, is testable via
       buildFeedbackQueueApp (core-apps.ts), and is opened "on demand" via
       open_artifact/open_widget exactly like workspace-pulse — no scheduled
       job, matching the feature's non-goals.
    3. It reuses the exact `feedback-list` / `feedback-set-status` curated
       tool names Phase 2's live queue app will call too (Part F makes them
       available to store-backed apps as well), so nothing here is thrown
       away when Phase 2 lands.

  Screenshot rendering (explicitly deferred to Phase 2 — see the inline
  comment near renderScreenshotBadge below): this view shows a small
  indicator (camera glyph + dimensions + byte size + filename) instead of an
  actual thumbnail. Rendering a real image needs either a local HTTP
  static-serve route scoped to ~/.luna/feedback-screenshots/, or inlining a
  base64 THUMBNAIL (keeping the full-res PNG on disk) — both need new
  transport plumbing beyond a read-only MCP tool call. Out of scope here.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--color-background-primary, #0a0e1c);
    color: var(--color-text-primary, #e2ecfd);
    font-family: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    font-size: 13px;
    overflow: hidden;
  }

  #root {
    display: flex;
    flex-direction: column;
    width: 100%; height: 100%;
    min-width: 320px; min-height: 220px;
    overflow: hidden;
  }

  #header {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--color-border-primary, rgba(255,255,255,0.07));
    flex-shrink: 0;
  }

  #header-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--color-ring-primary, #8ab4f8);
    text-transform: uppercase;
    flex: 1;
  }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4b5563;
    flex-shrink: 0;
    transition: background 0.4s ease;
  }
  #status-dot.live { background: #34d399; box-shadow: 0 0 5px #34d39966; }
  #status-dot.err  { background: #f87171; box-shadow: 0 0 4px #f8717155; }

  #status-label {
    font-size: 10px;
    color: var(--color-text-tertiary, #64748b);
    font-variant-numeric: tabular-nums;
  }

  #error-banner {
    display: none;
    padding: 6px 14px;
    font-size: 11px;
    color: #f87171;
    background: rgba(248,113,113,0.08);
    border-bottom: 1px solid rgba(248,113,113,0.2);
    flex-shrink: 0;
  }
  #error-banner.show { display: block; }

  #list {
    flex: 1 1 0;
    overflow-y: auto;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #empty {
    padding: 24px 14px;
    text-align: center;
    color: var(--color-text-tertiary, #64748b);
    font-size: 12px;
    display: none;
  }
  #empty.show { display: block; }

  .row {
    background: var(--color-background-secondary, rgba(255,255,255,0.04));
    border: 1px solid var(--color-border-primary, rgba(255,255,255,0.09));
    border-radius: var(--border-radius-md, 8px);
    padding: 9px 11px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .row-note {
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--color-text-primary, #e2ecfd);
    word-break: break-word;
  }

  .row-meta {
    font-size: 10.5px;
    color: var(--color-text-tertiary, #64748b);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .row-shot {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--color-text-tertiary, #8ab4f8);
  }

  .row-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }

  .pill {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .pill.open       { background: rgba(138,180,248,0.15); color: #8ab4f8; }
  .pill.triaged    { background: rgba(250,204,21,0.15);  color: #facc15; }
  .pill.queued     { background: rgba(167,139,250,0.18); color: #a78bfa; }
  .pill.resolved   { background: rgba(52,211,153,0.15);  color: #34d399; }
  .pill.job-failed { background: rgba(248,113,113,0.16); color: #f87171; }
  .pill.wontfix    { background: rgba(148,163,184,0.15); color: #94a3b8; }
  /* Any status the panel doesn't have an explicit colour for still renders
     as a neutral pill rather than an unstyled bare word. */
  .pill { background: rgba(148,163,184,0.15); color: #94a3b8; }

  /* The job link: "which durable job is working this report" (resolvedRef). */
  .row-job {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: var(--color-text-tertiary, #6b7a90);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .row-job::before { content: "\1F3AB"; font-family: initial; }

  button.create-job {
    background: rgba(167,139,250,0.15);
    color: #a78bfa;
    border: 1px solid rgba(167,139,250,0.35);
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 9px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  button.create-job:hover:not(:disabled) { background: rgba(167,139,250,0.28); }
  button.create-job:disabled { opacity: 0.5; cursor: default; }

  select.status-select {
    background: var(--color-background-primary, #0a0e1c);
    color: var(--color-text-primary, #e2ecfd);
    border: 1px solid var(--color-border-primary, rgba(255,255,255,0.12));
    border-radius: 5px;
    font-size: 10.5px;
    padding: 2px 4px;
  }

  .row-err {
    font-size: 10px;
    color: #f87171;
    display: none;
  }
  .row-err.show { display: block; }

  #footer {
    flex-shrink: 0;
    padding: 4px 14px 9px;
    font-size: 10px;
    color: var(--color-text-tertiary, #3d4d65);
    letter-spacing: 0.02em;
  }
</style>

<div id="root">
  <div id="header">
    <span id="header-title">Feedback Queue</span>
    <span id="status-dot"></span>
    <span id="status-label">connecting</span>
  </div>
  <div id="error-banner"></div>
  <div id="list"></div>
  <div id="empty">No feedback yet.</div>
  <div id="footer">mcp app · ui://luna/feedback-queue</div>
</div>

<script>
(function () {
  'use strict';

  // ── Raw MCP Apps JSON-RPC endpoint (postMessage, parent = the host) ──
  // Same minimal protocol shim as workspace-pulse.html — no SDK, no network.
  var nextId = 1;
  var pending = {};

  function post(msg) {
    window.parent.postMessage(msg, '*');
  }

  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending[id] = { resolve: resolve, reject: reject };
      post({ jsonrpc: '2.0', id: id, method: method, params: params || {} });
    });
  }

  function notify(method, params) {
    post({ jsonrpc: '2.0', method: method, params: params || {} });
  }

  function applyHostStyles(styles) {
    if (!styles || typeof styles !== 'object') return;
    var vars = styles.variables || styles;
    if (!vars || typeof vars !== 'object') return;
    var root = document.documentElement;
    for (var k in vars) {
      if (Object.prototype.hasOwnProperty.call(vars, k) && typeof vars[k] === 'string') {
        try { root.style.setProperty(k, vars[k]); } catch (_) {}
      }
    }
  }

  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;
    var m = e.data;
    if (!m || typeof m !== 'object' || m.jsonrpc !== '2.0') return;
    if (m.id !== undefined && m.id !== null && ('result' in m || 'error' in m)) {
      var p = pending[m.id];
      if (!p) return;
      delete pending[m.id];
      if ('error' in m) p.reject(m.error || { message: 'error' });
      else p.resolve(m.result);
      return;
    }
    if (m.method === 'ui/notifications/host-context-changed' && m.params) {
      applyHostStyles(m.params.styles);
      return;
    }
    return;
  });

  // ── DOM ───────────────────────────────────────────────
  var dotEl        = document.getElementById('status-dot');
  var labelEl      = document.getElementById('status-label');
  var errorBanner  = document.getElementById('error-banner');
  var listEl       = document.getElementById('list');
  var emptyEl      = document.getElementById('empty');

  function setStatus(cls, label) {
    dotEl.className = cls;
    labelEl.textContent = label;
  }

  function showError(msg) {
    if (!msg) {
      errorBanner.classList.remove('show');
      errorBanner.textContent = '';
      return;
    }
    errorBanner.textContent = msg;
    errorBanner.classList.add('show');
  }

  function callTool(name, args) {
    return request('tools/call', { name: name, arguments: args || {} }).then(function (result) {
      // Core apps reply spec-shaped: { content: [...], structuredContent }.
      return result && typeof result === 'object' && 'structuredContent' in result
        ? result.structuredContent
        : result;
    });
  }

  // Statuses a human sets directly from the dropdown. `queued`/`job-failed`
  // are set by the backend (job enqueue / the completion observer) and are
  // shown as pills but never offered as manual choices — see renderRow, which
  // still surfaces the CURRENT status in the select even when it is one of
  // those system values so the control never misrepresents the row.
  var HUMAN_STATUSES = ['open', 'triaged', 'resolved', 'wontfix'];

  // Mirror of TERMINAL_STATUSES in feedback-job-bridge.ts: a report in one of
  // these is closed, so the bridge will not (re)queue a job for it and the
  // panel hides the Create job action.
  var TERMINAL_STATUSES = { resolved: 1, wontfix: 1, 'job-failed': 1, dismissed: 1 };

  function isTerminal(status) { return !!TERMINAL_STATUSES[status]; }

  function fmtTs(ms) {
    var n = Number(ms);
    if (!n || !isFinite(n)) return '';
    try { return new Date(n).toISOString().replace('T', ' ').slice(0, 19); } catch (_) { return ''; }
  }

  function fmtBytes(n) {
    var v = Number(n) || 0;
    if (v < 1024) return v + ' B';
    if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KB';
    return (v / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // Screenshot thumbnails are deliberately NOT rendered here (Phase 2, see
  // the file-level comment above) — this only shows a lightweight indicator
  // when the note has one on disk, derived purely from the metadata the
  // feedback-list tool already returns (no filesystem/network access from
  // this sandbox).
  function renderScreenshotBadge(row) {
    if (!row.screenshotPath) return '';
    var name = String(row.screenshotPath).split('/').pop() || 'screenshot.png';
    var dims = (row.screenshotWidth && row.screenshotHeight)
      ? (row.screenshotWidth + '×' + row.screenshotHeight)
      : '';
    return '<span class="row-shot" title="' + escapeHtml(row.screenshotPath) + '">📷 ' +
      escapeHtml([dims, name].filter(Boolean).join(' · ')) + '</span>';
  }

  // The linked durable job (resolvedRef) — "which job is working this report".
  // Always emitted; syncControls() fills the text and toggles visibility so the
  // create/status handlers have a stable node to update after a job is made.
  function renderJobLink(row) {
    return '<span class="row-job" style="display:none">' + escapeHtml(row.resolvedRef || '') + '</span>';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderRow(row) {
    var el = document.createElement('div');
    el.className = 'row';
    el.dataset.id = row.id;

    var metaBits = [];
    if (row.page) metaBits.push(escapeHtml(row.page));
    if (row.selector) metaBits.push(escapeHtml(row.selector));
    metaBits.push(fmtTs(row.createdAt));
    var shotBadge = renderScreenshotBadge(row);

    el.innerHTML =
      '<div class="row-note">' + escapeHtml(row.note) + '</div>' +
      '<div class="row-meta">' +
        '<span class="pill ' + escapeHtml(row.status) + '">' + escapeHtml(row.status) + '</span>' +
        metaBits.filter(Boolean).map(function (b) { return '<span>' + b + '</span>'; }).join('') +
        shotBadge +
        renderJobLink(row) +
      '</div>' +
      '<div class="row-controls">' +
        '<select class="status-select"></select>' +
        '<button class="create-job" type="button">Create job</button>' +
      '</div>' +
      '<div class="row-err"></div>';

    var select = el.querySelector('.status-select');
    // Offer the human-settable statuses, plus the row's CURRENT status when it
    // is a backend-set value (queued / job-failed) so the control always shows
    // the true state instead of silently snapping to the first option.
    var options = HUMAN_STATUSES.slice();
    if (options.indexOf(row.status) === -1) options.unshift(row.status);
    options.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      if (s === row.status) opt.selected = true;
      select.appendChild(opt);
    });

    var rowErr = el.querySelector('.row-err');
    var pill = el.querySelector('.pill');
    var jobLink = el.querySelector('.row-job');
    var createBtn = el.querySelector('.create-job');

    // Reflect the current row state onto the pill, job link, and Create-job
    // button in one place so the create/status handlers can just call it.
    function syncControls() {
      pill.className = 'pill ' + row.status;
      pill.textContent = row.status;
      if (jobLink) jobLink.style.display = row.resolvedRef ? '' : 'none';
      if (jobLink && row.resolvedRef) jobLink.textContent = row.resolvedRef;
      // A job already exists, or the report is closed -> nothing to create.
      var canCreate = !row.resolvedRef && !isTerminal(row.status);
      createBtn.style.display = canCreate ? '' : 'none';
      createBtn.disabled = !canCreate;
    }
    syncControls();

    select.addEventListener('change', function () {
      var next = select.value;
      rowErr.classList.remove('show');
      callTool('feedback-set-status', { id: row.id, status: next })
        .then(function (res) {
          if (res && res.ok) {
            row.status = next;
            syncControls();
          } else {
            rowErr.textContent = (res && res.message) || 'Could not update status.';
            rowErr.classList.add('show');
            select.value = row.status; // revert
          }
        })
        .catch(function () {
          rowErr.textContent = 'Could not update status (call failed).';
          rowErr.classList.add('show');
          select.value = row.status;
        });
    });

    createBtn.addEventListener('click', function () {
      rowErr.classList.remove('show');
      createBtn.disabled = true;
      createBtn.textContent = 'Creating…';
      callTool('feedback-create-job', { id: row.id })
        .then(function (res) {
          if (res && res.ok) {
            // The bridge links the note to a durable job and moves it to
            // 'queued'; reflect both without a reload.
            row.status = 'queued';
            if (res.jobId) row.resolvedRef = res.jobId;
            var opt = document.createElement('option');
            opt.value = 'queued';
            opt.textContent = 'queued';
            select.insertBefore(opt, select.firstChild);
            select.value = 'queued';
            createBtn.textContent = 'Create job';
            syncControls();
          } else {
            rowErr.textContent = (res && res.message) || 'Could not create job.';
            rowErr.classList.add('show');
            createBtn.textContent = 'Create job';
            createBtn.disabled = false;
          }
        })
        .catch(function () {
          rowErr.textContent = 'Could not create job (call failed).';
          rowErr.classList.add('show');
          createBtn.textContent = 'Create job';
          createBtn.disabled = false;
        });
    });

    return el;
  }

  function render(rows) {
    listEl.innerHTML = '';
    if (!rows || rows.length === 0) {
      emptyEl.classList.add('show');
      return;
    }
    emptyEl.classList.remove('show');
    rows.forEach(function (row) {
      try { listEl.appendChild(renderRow(row)); } catch (_) { /* one bad row must not break the panel */ }
    });
  }

  function load() {
    showError(null);
    callTool('feedback-list', { limit: 50, offset: 0 })
      .then(function (page) {
        var rows = (page && Array.isArray(page.rows)) ? page.rows : [];
        render(rows);
        setStatus('live', rows.length + ' item' + (rows.length === 1 ? '' : 's'));
      })
      .catch(function (err) {
        setStatus('err', 'error');
        showError((err && err.message) || 'Failed to load feedback.');
      });
  }

  // ── Handshake: initialize → initialized → load ────────
  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'feedback-queue', version: '1.0.0' },
  })
    .then(function (result) {
      applyHostStyles(result && result.styles);
      notify('ui/notifications/initialized');
      load();
    })
    .catch(function () {
      setStatus('err', 'init failed');
      showError('Failed to initialize.');
    });
})();
</script>
