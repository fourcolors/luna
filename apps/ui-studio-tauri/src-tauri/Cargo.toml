[package]
name = "luna-studio-ui"
version = "0.1.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Clipboard write-text only (capabilities/default.json grants exactly
# clipboard-manager:allow-write-text) — see phase0-spike-spec.md decision 8.
tauri-plugin-clipboard-manager = "2"
# Native OS notification banners (Phase 2). The notify_thread command wraps
# app.notification().builder()...show(); core:default already covers Studio's
# own commands, so no allow-notify capability is added. Mirrors Moon.
tauri-plugin-notification = "2"
# v1 staged-on-boot self-update (see update-train-spec.md decision 4): check
# → download_and_install on a background task in setup, no mid-session
# restart, no UI. Feed + pubkey live in tauri.conf.json under plugins.updater.
tauri-plugin-updater = "2"
# Deep-link (luna://...) registration + runtime on_open_url. Pairs with the
# single-instance plugin below so a luna:// URL opened while Studio is already
# running is forwarded into the live process instead of spawning a second one.
tauri-plugin-deep-link = "2"
# `tauri::generate_context!` expands code that needs `serde_json` in scope now
# that tauri.conf.json has a `plugins` block (the updater config parses as raw
# JSON at compile time). Not used directly in main.rs.
serde_json = "1"
# Derive feeds the LocalConnection payload that the `load_local_connection`
# command (main.rs) serializes back to the webview for native first-run
# provisioning from ~/.luna/.env.
serde = { version = "1", features = ["derive"] }

# Single-instance guard with the deep-link feature: on the desktop targets a
# second process launched by a luna:// URL forwards its argv to the first
# instance (which re-emits on_open_url) and exits, so deep links never spawn a
# duplicate window. Must be the first plugin registered in the builder chain.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Always-on (NOT feature-gated, macOS only): the webview cache-bust
# (clear_webview_disk_cache, main.rs) needs MainThreadMarker + NSString/NSSet/
# NSDate + WKWebsiteDataStore to build the cache-clear call on every build.
# Ported from apps/ui-moon-tauri/src-tauri/Cargo.toml — versions pinned
# identically to Moon; ONLY the crates Moon's purge function needs, none of
# Moon's voice/AppKit/updater stack.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSString", "NSSet", "NSDate"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-web-kit]
version = "0.3.2"
default-features = false
features = ["WKWebsiteDataStore", "WKWebsiteDataRecord"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "luna-studio-ui"
path = "src/main.rs"
