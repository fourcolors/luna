[package]
name = "luna-moon-ui"
version = "0.0.9"
description = "Native transparent floating Moon companion for Luna"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2"
# Self-update from GitHub Releases (minisign-verified). Drives the
# check_for_update / install_update commands in main.rs.
tauri-plugin-updater = "2"
# Local-shell executor: async spawn with a bounded timeout + piped output.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util"] }

[target.'cfg(unix)'.dependencies]
# kill(2) the child's process group on timeout (mirrors the CLI's detached spawn).
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
