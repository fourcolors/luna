[package]
name = "luna-moon-ui"
version = "0.0.67"
description = "Native transparent floating Moon companion for Luna"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2"
# Self-update from GitHub Releases (minisign-verified). Drives the
# check_for_update / apply_update commands in main.rs.
tauri-plugin-updater = "2"
# Open the system browser for the connector OAuth consent hop (PRD A §09).
# The Moon previously had NO programmatic browser-open path.
tauri-plugin-opener = "2"
# Native OS notifications (macOS Notification Center / Linux libnotify /
# Windows toast). Drives the `notify` command in main.rs — the Moon raises a
# desktop notification when a background/scheduled job result is delivered to
# the chat while the user isn't watching.
tauri-plugin-notification = "2"
# Local-shell executor: async spawn with a bounded timeout + piped output.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util"] }
# TOML parsing for ~/.luna/client.toml (Phase-2 C3 route config).
toml = "0.8"
# TOML editing that preserves comments and field order (used by set_default_route).
toml_edit = "0.22"
# base64 encoding for the native-window-screenshot IPC payload
# (capture_window_screenshot shells out to the macOS `screencapture` CLI and
# ships the resulting PNG bytes to the frontend as base64 over Tauri IPC).
base64 = "0.22"
# WebdriverIO E2E (macOS): embedded W3C WebDriver server.
# Optional — enable with `--features wdio-e2e` (see e2e/README.md).
# Not in default features so production release builds never link it.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
# Used in client_config unit tests for atomic-write round-trips.
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# kill(2) the child's process group on timeout (mirrors the CLI's detached spawn).
libc = "0.2"

# ── Voice pipeline ──────────────────────────────────────────────────────
# All optional + gated behind the `voice` feature (ON by default for the
# app). An audio-free build is still possible with:
#   cargo build --no-default-features --features custom-protocol
[dependencies.cpal]
version = "0.17"
optional = true

[dependencies.voice_activity_detector]
version = "0.2"
optional = true

[dependencies.whisper-rs]
version = "0.16"
features = ["metal"]
optional = true

[dependencies.hound]
version = "3"
optional = true

# macOS TTS engine: AVSpeechSynthesizer via objc2 (src/voice/tts_avspeech.rs).
# Versions + feature sets verified by the compiled probe in
# .scratch/avspeech-probe (see its FINDINGS.md). `default-features = false`
# on objc2-avf-audio matters: the default set pulls the whole AVAudioEngine +
# audio-toolbox surface this engine never touches.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.4"

# AppKit bindings for the event-driven native resize (begin_native_resize),
# driven by NSEvent monitors
# (no polling pacer): NSEvent::mouseLocation() (screen coords) +
# NSEvent::pressedMouseButtons() (left-button bitmask) drive the gesture.
[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
# `block2` enables addLocal/GlobalMonitorForEventsMatchingMask:handler: — the
# event-driven native resize installs NSEvent monitors instead of polling.
# `NSWindowRestoration` (+ its `NSResponder` cfg partner) exposes
# NSWindow.setRestorable — the saved-state opt-out in
# windows::disable_window_state_restoration. `NSApplication` exposes the
# explicit app activation in windows::activate_app — under Stage Manager,
# activation is what swaps Moon's composited stage in.
features = [
    "NSWindow",
    "NSEvent",
    "NSResponder",
    "NSWindowRestoration",
    "NSApplication",
    "block2",
]

# Block (Obj-C closure) support for the NSEvent monitor handlers that drive the
# event-driven native window resize (begin_native_resize). macOS-gated like the
# other objc2 deps.
[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"

# Core geometry types (CGRect/CGPoint/CGSize) for the native resize frame math.
# objc2-foundation re-exports these but is `optional = true` (voice-only), so
# we depend on core-foundation directly — available in BOTH the voice and
# non-voice builds, macOS-gated like the other objc2 deps.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
default-features = false
features = ["CFCGTypes"]

# Always-on (NOT voice-gated): the webview cache-bust (clear_webview_disk_cache,
# main.rs) needs NSString/NSSet/NSDate to build the WKWebsiteDataStore clear call
# on every build, voice or not.
[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSString", "NSArray", "NSEnumerator", "NSObject", "NSSet", "NSDate"]

# macOS WKWebView data store — WKWebsiteDataStore::removeDataOfTypes: clears the
# webview DISK/MEMORY cache so an app update never serves stale embedded frontend
# (WKWebView otherwise keeps caching tauri:// assets across versions). Used by
# clear_webview_disk_cache in main.rs; preserves localStorage/IndexedDB.
[target.'cfg(target_os = "macos")'.dependencies.objc2-web-kit]
version = "0.3.2"
default-features = false
features = ["WKWebsiteDataStore", "WKWebsiteDataRecord"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-avf-audio]
version = "0.3.2"
optional = true
default-features = false
features = ["std", "AVSpeechSynthesis"]

[features]
default = ["custom-protocol", "voice"]
custom-protocol = ["tauri/custom-protocol"]
# Local voice pipeline (cpal mic capture → Silero VAD → whisper STT → TTS).
# Lives in src/voice/ behind this feature; src/lib.rs exposes it to both bins.
# The objc2 deps are target-gated to macOS above — enabling them here is a
# no-op on every other platform (cargo activates a `dep:` only where the
# dependency is declared).
voice = [
  "dep:cpal",
  "dep:voice_activity_detector",
  "dep:whisper-rs",
  "dep:hound",
  "dep:objc2-avf-audio",
]
# Enables the voice_spike e2e harness (which reuses the lib's voice
# modules — the feature now just gates the example target).
voice-spike = ["voice"]
# Embedded WebDriver for WebdriverIO E2E (apps/ui-moon-tauri/e2e). Never on
# by default — production release builds must omit this feature.
wdio-e2e = ["dep:tauri-plugin-wdio-webdriver"]

# Shared library target: the voice pipeline is one implementation consumed by
# both the app bin and the voice_spike bin. Named *_lib to avoid any clash
# with the luna-moon-ui bin target.
[lib]
name = "luna_moon_ui_lib"
path = "src/lib.rs"

[[bin]]
name = "luna-moon-ui"
path = "src/main.rs"

# The voice_spike e2e harness is an EXAMPLE, not a [[bin]]: the Tauri bundler
# copies every [[bin]] target into the .app and fails on one that wasn't
# built (required-features doesn't exempt it). Examples are never bundled.
# Run: cargo run --example voice_spike --features voice-spike --release -- --mic 8
[[example]]
name = "voice_spike"
path = "examples/voice_spike.rs"
required-features = ["voice-spike"]
