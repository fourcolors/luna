# Native drag-release watch: a native single-window drag hands the gesture to
# the OS via startDragging(), which swallows the webview's pointer events. This
# installs NSEvent mouse-up monitors in Rust and emits `luna-drag-released` on
# the real button release so snap-on-release fires exactly once (not on a
# mid-drag pause). See main.rs (watch_drag_release) and
# frontend/vendor/moon-dock.js (startNativeDrag).
[[permission]]
identifier = "allow-watch-drag-release"
description = "Allows the watch_drag_release command"
commands.allow = ["watch_drag_release"]
