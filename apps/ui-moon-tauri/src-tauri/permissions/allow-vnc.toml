[[permission]]
identifier = "allow-vnc"
description = "Allows the Screen Share panel to open and close a loopback WebSocket-to-TCP bridge to a VNC host (vnc_connect validates the host and binds only 127.0.0.1; vnc_disconnect aborts a live bridge task)."

[permission.commands]
allow = [
  "vnc_connect",
  "vnc_disconnect"
]
