<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Widget</title>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/deck-snap.js"></script>
  <script src="vendor/widget-sandbox.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: rgba(10, 14, 28, 0.96);
      --border: rgba(255, 255, 255, 0.09);
      --accent: #8ab4f8;
      --text: #e2ecfd;
      --muted: #64748b;
      --radius: 10px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* ── Title bar / drag region ─────────────────────────────────────────── */
    .title-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px 6px 10px;
      background: rgba(138, 180, 248, 0.04);
      border-bottom: 1px solid var(--border);
      user-select: none;
      flex-shrink: 0;
      min-height: 34px;
    }

    .grip {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: -1px;
      flex-shrink: 0;
      cursor: grab;
    }

    .bar-title {
      flex: 1;
      min-width: 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s;
    }
    .close-btn:hover { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }

    /* ── Dock pin (visible while snapped into a group) ───────────────────── */
    .pin-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--accent);
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }
    .pin-btn:hover { background: rgba(138, 180, 248, 0.15); }
    .pin-btn[hidden] { display: none; }
    .pin-btn.pop { animation: pin-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes pin-pop {
      0% { transform: scale(0) rotate(-35deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* ── Seam glow: the link animation when two windows click together ───── */
    #seam {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      z-index: 50;
    }
    #seam.flash-l { left: 0; top: 0; bottom: 0; width: 7px;
      background: linear-gradient(to right, rgba(138, 180, 248, 0.85), transparent); }
    #seam.flash-r { right: 0; top: 0; bottom: 0; width: 7px;
      background: linear-gradient(to left, rgba(138, 180, 248, 0.85), transparent); }
    #seam.flash-t { top: 0; left: 0; right: 0; height: 7px;
      background: linear-gradient(to bottom, rgba(138, 180, 248, 0.85), transparent); }
    #seam.flash-b { bottom: 0; left: 0; right: 0; height: 7px;
      background: linear-gradient(to top, rgba(138, 180, 248, 0.85), transparent); }
    #seam.on { animation: seam-flash 0.7s ease-out; }
    @keyframes seam-flash {
      0% { opacity: 0; }
      25% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ── Group perimeter: a very low highlight on OUTER sides only ───────── */
    #outline {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 49;
      border-radius: var(--radius);
      border: 0 solid transparent;
    }
    #outline.gl { border-left: 2px solid rgba(138, 180, 248, 0.45); }
    #outline.gr { border-right: 2px solid rgba(138, 180, 248, 0.45); }
    #outline.gt { border-top: 2px solid rgba(138, 180, 248, 0.45); }
    #outline.gb { border-bottom: 2px solid rgba(138, 180, 248, 0.45); }

    /* ── Outer layout ────────────────────────────────────────────────────── */
    .widget-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* ── Content area ────────────────────────────────────────────────────── */
    .content-area {
      flex: 1;
      overflow: auto;
      padding: 10px 12px;
    }
    .content-area::-webkit-scrollbar { width: 5px; }
    .content-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.10);
      border-radius: 3px;
    }

    /* ── Status / notices ────────────────────────────────────────────────── */
    .notice {
      padding: 12px;
      color: var(--muted);
      font-size: 0.75rem;
      font-style: italic;
    }

    /* ── Code block ──────────────────────────────────────────────────────── */
    pre {
      margin: 0;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: auto;
      padding: 10px 12px;
    }

    code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.72rem;
      line-height: 1.55;
      white-space: pre;
      color: #e2e8f0;
      background: transparent;
    }

    /* highlight.js tokens — matches Luna's dark-glass palette */
    .hljs                               { color: #e2e8f0; background: transparent; }
    .hljs-comment, .hljs-quote          { color: #6b7896; font-style: italic; }
    .hljs-keyword, .hljs-selector-tag,
    .hljs-literal, .hljs-section,
    .hljs-doctag                        { color: #c792ea; }
    .hljs-built_in, .hljs-type,
    .hljs-class .hljs-title             { color: #ffcb6b; }
    .hljs-string, .hljs-attr            { color: #c3e88d; }
    .hljs-variable, .hljs-template-variable { color: #f07178; }
    .hljs-number, .hljs-regexp,
    .hljs-link                          { color: #f78c6c; }
    .hljs-title, .hljs-function .hljs-title { color: #82aaff; }
    .hljs-operator, .hljs-punctuation  { color: #89ddff; }
    .hljs-deletion                      { color: #f07178; }
    .hljs-addition                      { color: #c3e88d; }
    /* kind=widget: the sandboxed iframe fills the content area. The widget
       controls its own background; we give it a white base so a transparent
       widget is legible. */
    .widget-frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  </style>
</head>
<body>
<div class="widget-shell">
  <!-- TITLE BAR — data-tauri-drag-region on the outer container enables
       native window drag. The close button is intentionally NOT drag-region. -->
  <div class="title-bar" data-tauri-drag-region id="title-bar">
    <span class="grip" data-tauri-drag-region>⋮⋮</span>
    <span class="bar-title" data-tauri-drag-region id="bar-title">Loading…</span>
    <button class="pin-btn" id="pin-btn" title="Unpin from group" aria-label="Unpin widget from its group" hidden>
      <!-- Lucide "pin" (ISC) — standard icon, not hand-drawn. -->
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 17v5"/>
        <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
      </svg>
    </button>
    <button class="close-btn" id="close-btn" title="Close" aria-label="Close widget">✕</button>
  </div>
  <div id="seam" aria-hidden="true"></div>
  <div id="outline" aria-hidden="true"></div>
  <!-- CONTENT AREA — pre/code populated by JS -->
  <div class="content-area" id="content-area">
    <pre><code id="code-block"></code></pre>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Read artifact id from query string (already decoded by URLSearchParams) ──
  var id = new URLSearchParams(location.search).get('id');

  // ── Tauri window handle ───────────────────────────────────────────────────
  var W = null;
  var label = null;
  try {
    if (window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow) {
      W = window.__TAURI__.window.getCurrentWindow();
      label = W.label;
    }
  } catch (_) { /* non-Tauri env — best-effort */ }

  // ── DOM refs ──────────────────────────────────────────────────────────────
  var barTitle = document.getElementById('bar-title');
  var codeEl = document.getElementById('code-block');
  var closeBtn = document.getElementById('close-btn');
  var contentArea = document.getElementById('content-area');

  // ── Close button ──────────────────────────────────────────────────────────
  closeBtn.addEventListener('click', function () {
    if (window.__TAURI__ && window.__TAURI__.core && label) {
      window.__TAURI__.core.invoke('close_widget', { label: label }).catch(function () {});
    } else {
      window.close();
    }
  });

  // ── Utility: show a text notice in the content area ───────────────────────
  function showNotice(msg) {
    contentArea.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'notice';
    p.textContent = msg;
    contentArea.appendChild(p);
  }

  // ── Widget sandbox bridge state (PRD §16) ─────────────────────────────────
  // A kind='widget' artifact is AGENT-AUTHORED CODE. It renders in a hard
  // sandbox (allow-scripts, NO allow-same-origin, strict CSP, no network) and
  // can only reach out through the cap-gated luna.* postMessage bridge.
  var widgetFrame = null;        // the current sandboxed <iframe>
  var widgetBridgeCaps = [];     // this widget's bridge_caps allowlist
  var widgetSubscribed = false;  // the widget called luna.subscribe()
  var lastArtifact = null;       // for luna.refresh() re-render

  function clearWidgetState() {
    widgetFrame = null;
    widgetBridgeCaps = [];
    widgetSubscribed = false;
  }

  function renderWidget(artifact) {
    lastArtifact = artifact;
    widgetBridgeCaps = Array.isArray(artifact.bridgeCaps) ? artifact.bridgeCaps : [];
    widgetSubscribed = false;
    contentArea.innerHTML = '';
    var iframe = document.createElement('iframe');
    iframe.className = 'widget-frame';
    // SECURITY (the trust boundary): allow-scripts WITHOUT allow-same-origin →
    // unique opaque origin: no parent-DOM access, no cookies/storage, no
    // window.__TAURI__. srcdoc (not src) → inline, no network load. The CSP +
    // bridge shim are assembled by the audited LunaWidgetSandbox.
    iframe.setAttribute(
      'sandbox',
      window.LunaWidgetSandbox ? LunaWidgetSandbox.SANDBOX_ATTR : 'allow-scripts'
    );
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    if (window.LunaWidgetSandbox) {
      iframe.srcdoc = LunaWidgetSandbox.buildSrcdoc(artifact.content || '');
    }
    widgetFrame = iframe;
    contentArea.appendChild(iframe);
  }

  // The host half of the luna.* bridge: accept messages ONLY from the current
  // widget iframe, and forward obs events ONLY for kinds the widget's
  // bridge_caps allow (fails closed). Set up once; the iframe reference gates it.
  window.addEventListener('message', function (e) {
    if (!widgetFrame || e.source !== widgetFrame.contentWindow) return;
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.__luna === 'subscribe') {
      widgetSubscribed = true; // the per-kind gate is applied on each forward
    } else if (m.__luna === 'refresh') {
      if (lastArtifact) renderWidget(lastArtifact);
    }
    // 'ready' is a no-op in v1; luna.ask() is deferred to v2 (needs consent).
  });

  // ── Render artifact ───────────────────────────────────────────────────────
  // XSS-CRITICAL: content is agent/user-controlled.
  // - kind='widget' → the sandboxed iframe above (executes, but caged).
  // - all other kinds → escaped source via .textContent (NEVER innerHTML),
  //   so even html/widget-source renders as text and never executes here.
  function render(artifact) {
    if (!artifact) return;

    // Title bar: "filename.sh · v2"
    var titleText = (artifact.title || 'Artifact') + ' · v' + (artifact.version || 1);
    barTitle.textContent = titleText;

    if (artifact.kind === 'widget') {
      renderWidget(artifact);
      return;
    }
    clearWidgetState();

    // Restore the pre>code structure (may have been replaced by a notice/iframe).
    if (!document.getElementById('code-block')) {
      contentArea.innerHTML = '';
      var pre = document.createElement('pre');
      var code = document.createElement('code');
      code.id = 'code-block';
      pre.appendChild(code);
      contentArea.appendChild(pre);
      codeEl = code;
    }

    codeEl.textContent = artifact.content || '';
    codeEl.className = 'language-' + (artifact.lang || '');
    if (window.hljs) {
      try { hljs.highlightElement(codeEl); } catch (_) { /* graceful degrade */ }
    }
  }

  // ── WebSocket wiring ──────────────────────────────────────────────────────
  var ws = null;
  var reconnectTimer = null;
  var didReconnect = false; // only attempt one reconnect

  function connect(wsUrl, wsToken) {
    if (ws) { try { ws.close(); } catch (_) {} ws = null; }
    var sep = wsUrl.includes('?') ? '&' : '?';
    var fullUrl = wsToken ? wsUrl + sep + 'token=' + encodeURIComponent(wsToken) : wsUrl;
    try {
      ws = new WebSocket(fullUrl);
    } catch (e) {
      showNotice('WebSocket error: ' + (e && e.message ? e.message : String(e)));
      return;
    }

    ws.addEventListener('open', function () {
      // A fresh socket is up → re-arm the single-retry budget so each DISTINCT
      // disconnect gets its own one delayed reconnect (review G3 — without this
      // the window gives up forever after the first drop+retry).
      didReconnect = false;
    });

    ws.addEventListener('message', function (evt) {
      var frame;
      try { frame = JSON.parse(evt.data); } catch (_) { return; }

      switch (frame.type) {
        case 'hello':
          if (!frame.capabilities || !frame.capabilities.artifacts) {
            showNotice("This server doesn't support pinned artifacts.");
          }
          break;
        case 'artifact-list': {
          var list = frame.artifacts;
          if (!Array.isArray(list)) break;
          var found = null;
          for (var i = 0; i < list.length; i++) {
            if (list[i].id === id) { found = list[i]; break; }
          }
          if (found) {
            render(found);
          } else {
            showNotice('This artifact is no longer pinned.');
          }
          break;
        }
        case 'artifact-update':
          if (frame.artifact && frame.artifact.id === id) {
            render(frame.artifact);
          }
          break;
        case 'ping':
          try { ws.send(JSON.stringify({ type: 'pong', ts: frame.ts })); } catch (_) {}
          break;
        case 'event':
          // Obs-event stream → forward to a SUBSCRIBED widget, but ONLY for the
          // kinds its bridge_caps allow (cap-gated; fails closed). This is the
          // single read-only door out of the sandbox (luna.subscribe).
          if (
            widgetFrame &&
            widgetSubscribed &&
            frame.event &&
            window.LunaWidgetSandbox &&
            LunaWidgetSandbox.subscribeAllowed(widgetBridgeCaps, frame.event.kind)
          ) {
            try {
              widgetFrame.contentWindow.postMessage(
                { __luna: 'event', event: frame.event },
                '*'
              );
            } catch (_) { /* iframe gone */ }
          }
          break;
        default:
          break;
      }
    });

    ws.addEventListener('close', function () {
      showNotice('Disconnected');
      // One reconnect attempt after 2 s — don't hammer.
      if (!didReconnect) {
        didReconnect = true;
        reconnectTimer = setTimeout(function () {
          reconnectTimer = null;
          init(); // re-read creds and reconnect
        }, 2000);
      }
    });

    ws.addEventListener('error', function () {
      // The 'close' event will fire next; let it drive reconnect logic.
    });
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  async function init() {
    var creds = null;
    try {
      if (window.__TAURI__ && window.__TAURI__.core) {
        creds = await window.__TAURI__.core.invoke('load_connection');
      }
    } catch (_) { /* not in Tauri */ }

    if (!creds || !creds.wsUrl) {
      showNotice('Not connected — no connection profile found.');
      return;
    }

    connect(creds.wsUrl, creds.wsToken || null);
  }

  init();

  // ── Self-snap + dock groups (operator-verify — best-effort, wraps every
  //    Tauri call in try/catch so errors never propagate). Snapping within
  //    22 px of the hub or any sibling widget LINKS the windows into a flat
  //    group: Rust natively parents them (zero-lag cluster drag), re-roots
  //    the group at whichever member is grabbed (grab_dock on pointerdown),
  //    and pushes `dock-group` state — pin visibility and the faint
  //    perimeter outline render from that state, never from local guesses.
  //    Leaving a group = the pin, nothing else.
  //    OPERATOR-VERIFY: requires a real Tauri build; the snap/position APIs
  //    are no-ops (or absent) in the browser/test env.
  (function wireDeckSnap() {
    if (!W) return; // not in Tauri
    var pinBtn = document.getElementById('pin-btn');
    var seamEl = document.getElementById('seam');
    var outlineEl = document.getElementById('outline');
    var groupMembers = []; // my group's labels (incl. me); [] = ungrouped

    function setDock(docked, anchor, edge) {
      try {
        if (window.__TAURI__ && window.__TAURI__.core) {
          window.__TAURI__.core.invoke('set_dock', {
            docked: docked,
            anchor: docked ? anchor : null,
            edge: docked ? edge : null,
          }).catch(function () {});
        }
      } catch (_) { /* best-effort */ }
    }

    // The widget's TOUCHING side is opposite the anchor-relative edge
    // ("r" = we sit at the anchor's right → our LEFT edge touches).
    function oppositeEdge(edge) {
      return { l: 'r', r: 'l', t: 'b', b: 't' }[edge] || null;
    }

    function flashSeam(side) {
      if (!seamEl || !side) return;
      seamEl.className = '';
      void seamEl.offsetWidth; // restart the animation
      seamEl.className = 'flash-' + side + ' on';
    }
    seamEl && seamEl.addEventListener('animationend', function () {
      seamEl.className = '';
    });

    // All link state renders from Rust's dock-group events — single source
    // of truth, no local pin/outline bookkeeping to drift out of sync.
    function applyGroupState(payload) {
      var grouped = !!(payload && payload.grouped);
      groupMembers = grouped && Array.isArray(payload.members) ? payload.members : [];
      if (pinBtn) {
        if (grouped && pinBtn.hidden) {
          pinBtn.hidden = false;
          pinBtn.classList.add('pop');
        } else if (!grouped) {
          pinBtn.hidden = true;
          pinBtn.classList.remove('pop');
        }
      }
      if (outlineEl) {
        var sides = grouped && Array.isArray(payload.outlineSides) ? payload.outlineSides : [];
        outlineEl.className = sides.map(function (s) { return 'g' + s; }).join(' ');
      }
    }
    pinBtn && pinBtn.addEventListener('animationend', function () {
      pinBtn.classList.remove('pop');
    });

    // Unpin = leave the group. Rust unparents, ejects us a step past the
    // magnet range, and pushes fresh dock-group state to everyone.
    pinBtn && pinBtn.addEventListener('click', function () {
      setDock(false);
    });

    // Re-root the group at THIS window the instant it is grabbed, so the
    // native drag carries the whole cluster regardless of which member the
    // user picked up. Capture phase: must precede the native drag region.
    document.addEventListener('pointerdown', function (e) {
      try {
        if (!e.target || !e.target.closest) return;
        if (!e.target.closest('[data-tauri-drag-region]')) return;
        if (window.__TAURI__ && window.__TAURI__.core) {
          window.__TAURI__.core.invoke('grab_dock', {}).catch(function () {});
        }
      } catch (_) { /* best-effort */ }
    }, true);

    try {
      if (window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen) {
        window.__TAURI__.event.listen('dock-link', function (e) {
          var edge = e && e.payload && e.payload.edge;
          flashSeam(edge); // anchor side: our touching side IS the edge
        }).catch(function () {});
        window.__TAURI__.event.listen('dock-group', function (e) {
          applyGroupState(e && e.payload);
        }).catch(function () {});
      }
    } catch (_) { /* best-effort */ }

    // Snap candidates: the hub first (it wins distance ties), then every
    // sibling widget — minus anything already in our group (a group never
    // re-snaps against itself; that was round 2's "random movements").
    async function candidateRects() {
      var out = [];
      var TW = window.__TAURI__ && window.__TAURI__.window;
      var skip = groupMembers;
      try {
        if (skip.indexOf('main') === -1) {
          var mainWin = TW && TW.Window && typeof TW.Window.getByLabel === 'function'
            ? await TW.Window.getByLabel('main')
            : null;
          if (mainWin) {
            var mp = await mainWin.outerPosition();
            var ms = await mainWin.outerSize();
            out.push({ label: 'main', rect: { x: mp.x, y: mp.y, w: ms.width, h: ms.height } });
          }
        }
      } catch (_) { /* hub unavailable — keep going */ }
      try {
        var labels = await window.__TAURI__.core.invoke('list_widget_windows');
        if (Array.isArray(labels)) {
          for (var i = 0; i < labels.length; i++) {
            if (labels[i] === label || skip.indexOf(labels[i]) !== -1) continue;
            try {
              var w = await TW.Window.getByLabel(labels[i]);
              if (!w) continue;
              var p = await w.outerPosition();
              var s = await w.outerSize();
              out.push({ label: labels[i], rect: { x: p.x, y: p.y, w: s.width, h: s.height } });
            } catch (_) { /* sibling vanished mid-enumeration */ }
          }
        }
      } catch (_) { /* listing unavailable */ }
      return out;
    }

    try {
      var snapSettleTimer = null;
      var lastMoveTime = 0;
      var THROTTLE_MS = 16;
      var DEBOUNCE_MS = 120;

      W.onMoved(function () {
        var now = Date.now();
        if (now - lastMoveTime < THROTTLE_MS) return;
        lastMoveTime = now;

        if (snapSettleTimer) { clearTimeout(snapSettleTimer); snapSettleTimer = null; }
        snapSettleTimer = setTimeout(async function () {
          try {
            // Minimize fires a spurious onMoved with nonsense coordinates
            // (tauri#7664) — never snap a minimized window.
            if (typeof W.isMinimized === 'function' && (await W.isMinimized())) return;
            if (!window.LunaDeckSnap) return;

            var myPos = await W.outerPosition();
            var mySize = await W.outerSize();
            var widgetRect = { x: myPos.x, y: myPos.y, w: mySize.width, h: mySize.height };
            // Window rects are PHYSICAL px; the 22px magnet is designed in
            // LOGICAL px — scale it, or Retina displays get a half-size
            // magnet (the live "won't snap" bug).
            var sf = 1;
            try { sf = (await W.scaleFactor()) || 1; } catch (_) { /* default 1 */ }

            // Best NEW link across outsiders = smallest move distance.
            var cands = await candidateRects();
            var best = null;
            for (var i = 0; i < cands.length; i++) {
              var snap = LunaDeckSnap.computeSnap(cands[i].rect, widgetRect, 22 * sf);
              if (!snap) continue;
              var d = Math.abs(snap.x - myPos.x) + Math.abs(snap.y - myPos.y);
              if (!best || d < best.d) best = { label: cands[i].label, snap: snap, d: d };
            }
