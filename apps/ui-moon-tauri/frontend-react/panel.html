<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Panel</title>
  <script src="/vendor/moon-protocol.js"></script>
  <script src="/vendor/moon-ws.js"></script>
  <script src="/vendor/moon-dock.js"></script>
  <script src="/vendor/moon-resize.js"></script>
  <!-- Google Fonts: Albert Sans (body) + Caveat (handwritten accent) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Watercolor palette tokens (must precede moon-theme.css so theme overrides win) -->
  <link rel="stylesheet" href="/vendor/moon-palette.css">
  <!-- Skin tokens (--dk-*): AFTER palette (references it), BEFORE theme (consumes it). -->
  <link rel="stylesheet" href="/vendor/moon-skins.css">
  <!-- Shared theme (tokens + widget-window chrome) loads BEFORE the page
       style so page-specific rules win ties. -->
  <link rel="stylesheet" href="/vendor/moon-theme.css">
  <!-- Stamps data-palette/data-theme/data-chrome/data-grain on <html> pre-paint -->
  <script src="/vendor/moon-appearance.js"></script>
  <!-- Honors the "Always on Top" setting for this panel (default: not floating). -->
  <script src="/vendor/moon-window-float.js"></script>
  <!-- Phase 2 C3 route module: MoonSession.resolveBootRoute / setPanelRoute /
       listRoutes / setDefaultRoute. Degrades gracefully when __TAURI__ is absent
       or client.toml does not exist (un-migrated user). -->
  <script src="/vendor/moon-session.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-body);
      font-size: 13px;
      /* background/border/border-radius removed: html/body is transparent
         (OS window transparency + moon-theme.css rule). The card shell
         lives on .widget-shell::before (vendor/moon-theme.css). */
      color: var(--text);
    }

    /* width/height managed by moon-theme.css (.widget-shell card shell).
       Only flex layout properties live here. */
    .widget-shell {
      display: flex;
      flex-direction: column;
    }

    .content-area {
      flex: 1;
      overflow: auto;
      padding: 14px;
    }

    .notice {
      padding: 12px;
      color: var(--muted);
      font-size: 0.75rem;
      font-style: italic;
    }

    /* Route indicator (plan Step 2): small + muted + italic like .notice
       above, colored by connection state - no dot (panels have no existing
       pill idiom to extend the way chat.html's #connection-status does).
       cursor: pointer (plan Step 3) - the chip doubles as the view-mode
       toggle affordance; role/tabindex are set in the markup below. */
    .route-indicator {
      font-size: 0.68rem;
      font-style: italic;
      margin-left: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90px;
      cursor: pointer;
    }
    .route-indicator.connected { color: #34d399; }
    .route-indicator.disconnected { color: #f87171; }

    /* ── Panel form chrome (settings panels) ─────────────────────────────── */
    /* display:flex would beat the [hidden] attribute's UA display:none -
       pin it (caught live: the install row showed while hidden). */
    [hidden] { display: none !important; }
    .panel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .panel-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: color-mix(in oklab, var(--accent) 12%, transparent);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.1s;
    }
    .panel-btn:hover { background: color-mix(in oklab, var(--accent) 22%, transparent); }
    .panel-btn.primary { background: var(--accent); color: var(--paper); border-color: transparent; }
    .panel-status { font-size: 0.78rem; color: var(--muted); }
    .panel-status.ok { color: #4a7d3a; }
    .panel-status.warn { color: #9a6b1f; }
    html[data-theme='dark'] .panel-status.ok { color: #7ee2a8; }
    html[data-theme='dark'] .panel-status.warn { color: #f8c982; }
  </style>
</head>
<body class="moon-astryx-root">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wc-wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="n" seed="7"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
  </defs>
</svg>
<div class="widget-shell">
  <div class="title-bar" id="title-bar">
    <div class="bar-start" aria-hidden="true"></div>
    <span class="bar-title" id="bar-title">Loading…</span>
    <!-- Route indicator (plan Step 2): names the route THIS panel's socket
         is on (its LABEL, never a routeKey), painted by connectWs's
         runConnectWaterfall + onOpen/onClose. Small + muted, matching
         .notice's idiom (panels have no existing status pill to extend,
         unlike chat.html's #connection-status). Hidden until a real route
         model resolves. role/tabindex (plan Step 3): the chip also toggles
         this window's view mode on click - wired below, near routeIndicatorEl. -->
    <span class="route-indicator disconnected" id="route-indicator" hidden role="button" tabindex="0"></span>
    <!-- Right cluster balances the lights so the title stays centered; also
         houses the collapse-to-moon glyph (on the right, clear of native
         traffic lights which sit top-left). -->
    <div class="bar-end">
      <button class="collapse-moon-btn" id="collapse-moon-btn"
              title="Collapse into the moon" aria-label="Collapse into the moon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"
             stroke="none" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a6.5 6.5 0 1 1-7.54-7.54A9.05 9.05 0 0 0 12 3z"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="content-area" id="content-area"></div>
</div>

<script>
(function () {
  'use strict';

  // ── Window / params ────────────────────────────────────────────────────
  var params = new URLSearchParams(location.search);
  var type = params.get('type') || '';

  var W = null;
  var label = null;
  try {
    if (window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow) {
      W = window.__TAURI__.window.getCurrentWindow();
      label = W.label;
    }
  } catch (_) { /* not in Tauri (tests/browser) */ }

  var contentArea = document.getElementById('content-area');
  var barTitle = document.getElementById('bar-title');
  var routeIndicatorEl = document.getElementById('route-indicator');

  // Route truth (plan Step 2/3): what THIS window's socket genuinely holds
  // right now - label, connection state, and (Step 3) the redacted endpoint
  // string. Hoisted to this outer scope (not connectWs's own closure) so the
  // view-mode seam below can read the SAME truth the chip paints, rather
  // than a second, possibly-stale copy. connectWs's paintRouteIndicator
  // (further down) is still the ONLY writer.
  var currentRouteLabel = null;
  var currentConnected = false;
  var currentEndpointDisplay = null;

  // View mode (plan Step 3): per-window, ephemeral, in-memory only - see
  // wire.ts's ViewMode (the twin chat-window implementation) for the full
  // rationale against persisting this anywhere (client.toml,
  // moon-session.json, or localStorage - the codebase's habitual trap for
  // exactly this shape of flag). Declared here, outside connectWs, so the
  // toggle survives independent of which panel type's connectWs call is in
  // flight (and works even for panels that never call connectWs at all -
  // the chip is simply hidden then, so there is nothing to click).
  var viewModeEnabled = false;
  function setViewMode(enabled) {
    viewModeEnabled = !!enabled;
  }
  // THE SEAM (plan Step 3): the ONLY pre-redacted, display-safe read surface
  // a future consumer (Step 4's verbose indicator form) may use. Every field
  // is either a plain boolean/string with no credential shape, or a value
  // ALREADY redacted at capture time (endpointDisplay - see describeUrlSafe
  // below, never a raw URL). No raw-URL field exists on the returned object,
  // so a consumer cannot bypass redaction by omission.
  function viewModeSeam() {
    return {
      enabled: viewModeEnabled,
      routeLabel: currentRouteLabel,
      connectionState: currentConnected,
      endpointDisplay: currentEndpointDisplay,
    };
  }
  if (routeIndicatorEl) {
    routeIndicatorEl.addEventListener('click', function () {
      setViewMode(!viewModeEnabled);
    });
  }

  // Collapse-into-moon is a Luna-specific workspace action, intentionally
  // separate from the native yellow button's per-window minimize behavior.
  var collapseMoonBtn = document.getElementById('collapse-moon-btn');
  collapseMoonBtn && collapseMoonBtn.addEventListener('click', function () {
    try {
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('collapse_to_moon').catch(function () {});
      }
    } catch (_) { /* best-effort */ }
  });

  function showNotice(text) {
    contentArea.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'notice';
    div.textContent = text;
    contentArea.appendChild(div);
    // Observability: record the last notice so agent-browser / tests can assert
    // whether a connection error was surfaced.
    if (window.__PanelInternals) window.__PanelInternals.lastNotice = text;
  }

  // ── Panel type modules ─────────────────────────────────────────────────
  // Each type lives in panels/<kind-with-dashes>.js and registers into
  // window.LunaPanelTypes (so harnesses can preload modules without a
  // network). The loader injects the script only when the type is not
  // already registered. Modules render with safe DOM methods only.
  var ctx = {
    label: label,
    win: W,
    hasTauri: !!(window.__TAURI__ && window.__TAURI__.core),
    invoke: function (cmd, args) {
      if (!window.__TAURI__ || !window.__TAURI__.core) {
        return Promise.reject(new Error('not in Tauri'));
      }
      return args === undefined
        ? window.__TAURI__.core.invoke(cmd)
        : window.__TAURI__.core.invoke(cmd, args);
    },
    // For WS-backed panels (vault/skills/connectors): build a gen-gated
    // client over the shared transport, connected with the stored creds.
    // Returns the client (already connecting); callers register frames on
    // the registry they passed in.
    //
    // Phase 2 C7 - per-panel route binding:
    //   1. Try MoonSession.resolveBootRoute(panelId) - uses any panel-specific
    //      route binding (set via set_panel_route) or falls back to the default
    //      route from client.toml. Returns RouteInfo { endpoints[], token_ref }.
    //   2. Use endpoints[0] as wsUrl. The token still comes from load_connection
    //      (token_ref resolution is Phase 3 / C6); if route resolution succeeds
    //      but load_connection fails, surface that error.
    //   3. If MoonSession is unavailable (no __TAURI__) or returns null (no
    //      client.toml / un-migrated), fall back to the legacy load_connection
    //      path unchanged.
    //   4. Child/settings panels opened from a parent panel inherit the DEFAULT
    //      route - no explicit parent-route signal is plumbed through panel.html
    //      today. Explicit parent→child route binding is a C8 follow-up.
    //
    // Error surfacing (Step 1c Part 3b: fixed reason + describeWsUrl(url)
    // where a url is in scope - NEVER e.message or the raw exception, which
    // for a WebSocket construction failure embeds the token-bearing URL
    // verbatim - see docs/next/routes-and-view-mode-plan.md, "The security
    // invariant, which is not deferrable"):
    //   - Off-Tauri (no __TAURI__): silent fallback (expected in browser dev).
    //   - Tauri present but route/connection failed: showNotice() with a
    //     fixed reason.
    connectWs: function (registry, opts) {
      var hasTauri = !!(window.__TAURI__ && window.__TAURI__.core);

      // Route indicator (plan Step 2). SOURCE OF TRUTH: this window's OWN
      // socket state, captured at connect time - never a broadcast. LATCH:
      // `connected: false` always applies immediately (a failure must
      // always stay visible); `connected: true` only fires from a REAL
      // socket 'open' (wired below via onOpen/onClose, the same raw-socket
      // signal the Workflows panel's own liveness hint already uses - panels
      // have no hello-frame handshake to gate on the way chat.html does).
      // Never renders routeKey - only route.label, or nothing when no route
      // model resolved (the legacy/fallback branches below never call this).
      //
      // currentRouteLabel/currentConnected/currentEndpointDisplay (F1, opus
      // review, blocker; endpointDisplay added Step 3): the label/state/
      // redacted-endpoint of whatever route THIS window's socket genuinely
      // holds right now - all three live in the outer IIFE scope (declared
      // near routeIndicatorEl, above) so the Step 3 view-mode seam can read
      // the SAME truth this chip paints, and all three only ever mutate
      // through paintRouteIndicator, which is called for a NEW route ONLY
      // after resolve_route_token has ALREADY succeeded (below), never
      // before. moon-ws.js's client.connect() is the ONLY thing that tears a
      // prior socket down - a token-resolution refusal never calls it - so
      // painting the new label BEFORE knowing resolve_route_token would
      // succeed used to leave the chip claiming a route this window's socket
      // was never actually on, while the OLD socket sat genuinely still
      // connected underneath it (wrong name AND wrong state, and permanent
      // once the old socket's own eventual onClose repainted using the wrong
      // captured label). Reset explicitly here (rather than relying on the
      // outer scope's initial null/false/null) so a hypothetical second
      // connectWs() call on the same page starts from a clean slate, same as
      // before these three variables were hoisted out of this closure.
      currentRouteLabel = null;
      currentConnected = false;
      currentEndpointDisplay = null;
      function paintRouteIndicator(label, connected, endpointDisplay) {
        currentRouteLabel = label;
        currentConnected = connected;
        // Step 3: only ever set from a value ALREADY redacted by the caller
        // (describeUrlSafe, below) - never a raw URL. Omitted entirely on
        // the no-route-model paths, which correctly leaves it null.
        currentEndpointDisplay = endpointDisplay || null;
        if (!routeIndicatorEl) return;
        routeIndicatorEl.hidden = !label;
        routeIndicatorEl.textContent = label || '';
        routeIndicatorEl.className = 'route-indicator ' + (connected ? 'connected' : 'disconnected');
      }

      // Wrap the CALLER's own onOpen/onClose (e.g. the Workflows panel's
      // liveness hint) rather than replace them - both fire.
      var callerOnOpen = opts && opts.onOpen;
      var callerOnClose = opts && opts.onClose;
      var mergedOpts = Object.assign({ registry: registry, autoPong: true }, opts || {}, {
        onOpen: function () {
          paintRouteIndicator(currentRouteLabel, true, currentEndpointDisplay);
          if (callerOnOpen) callerOnOpen();
        },
        onClose: function () {
          paintRouteIndicator(currentRouteLabel, false, currentEndpointDisplay);
          if (callerOnClose) callerOnClose();
        },
      });
      var client = LunaWS.createClient(mergedOpts);

      // Resolve the effective panel identifier (window label, populated from
      // Tauri when running inside the app; null in browser / test environments).
      var effectivePanelId = label || null;

      function describeUrlSafe(url) {
        return (window.LunaProtocol && typeof window.LunaProtocol.describeWsUrl === 'function')
          ? window.LunaProtocol.describeWsUrl(url)
          : '<unavailable>';
      }

      // Waterfall generation guard (Step 1c F1, opus review). moon-ws.js's
      // client.connect() gen-gates its OWN socket-level late events, but that
      // protects only the SOCKET, not this WATERFALL: Settings fires
      // connection-changed on every save, and the hub-event listener below
      // re-runs runConnectWaterfall() on every one of them, so two
      // overlapping runs race their two awaits. If the OLDER run's invokes
      // resolve LAST, its client.connect() call wins - and it bumps
      // moon-ws's gen itself when it fires, so the socket layer cannot save
      // the panel from landing on the stale route/token. Mirrors the Step 1a
      // F4 / PoolEngine closure-counter pattern: capture myGen at waterfall
      // entry, re-check after EVERY await, abandon silently when superseded.
      var waterfallGen = 0;

      // Runs the full connect waterfall against the SAME client/registry
      // every time. moon-ws.js's client.connect() already tears down its own
      // prior socket and re-generation-gates late events on every call, so
      // calling it again here (Step 1c Part 2's hub-event listener, below) is
      // a clean reconnect through the existing client, not a second one -
      // frame handlers registered on `registry` by the caller keep working
      // unchanged across a reconnect.
      function runConnectWaterfall() {
        var myGen = ++waterfallGen;
        if (typeof MoonSession !== 'undefined') {
          // Phase 2 C7 - per-panel route resolution via MoonSession (C3).
          // MoonSession.resolveBootRoute() returns null if:
          //   - client.toml not found → un-migrated user, fall back to legacy
          //   - any Tauri error → degrade gracefully
          MoonSession.resolveBootRoute(effectivePanelId).then(function (route) {
            if (myGen !== waterfallGen) return; // superseded during resolveBootRoute
            if (route && Array.isArray(route.endpoints) && route.endpoints.length > 0) {
              // Route resolved via client.toml - use the first endpoint as
              // the WebSocket URL. Step 1c Part 1: the token now comes from
              // the SAME route-keyed Rust resolver every other connect path
              // uses (resolve_route_token) instead of a panel-id-blind
              // load_connection that always keyed off cfg.default - the live
              // defect where a panel bound to a non-default route sent that
              // route's URL with ANOTHER route's token, no error raised.
              var wsUrl = route.endpoints[0];
              // Expose for observability (agent-browser smoke + future C8 hub).
              if (window.__PanelInternals) {
                window.__PanelInternals.resolvedRouteKey = route.key || null;
                window.__PanelInternals.resolvedRouteLabel = route.label || null;
              }
              ctx.invoke('resolve_route_token', { routeKey: route.key }).then(function (token) {
                if (myGen !== waterfallGen) return; // superseded during resolve_route_token
                // F1 (opus review, blocker): paint the NEW route's label with
                // a disconnected mark ONLY NOW that token resolution has
                // ACTUALLY succeeded - still before dialing (client.connect()
                // is the next line), so scenario 5 ("switching to a route
                // whose endpoint never accepts a connection... reads exactly
                // [the new label] before any connection has succeeded")
                // still holds. Painting any earlier (before this .then) would
                // claim this route before this window's socket could ever
                // possibly reach it, including on a refusal that never calls
                // client.connect() at all. Step 3: redact wsUrl HERE, at the
                // same capture moment as the label - describeUrlSafe is
                // already declared above; nothing downstream ever sees the
                // raw wsUrl again through this variable.
                paintRouteIndicator(route.label || null, false, describeUrlSafe(wsUrl));
                // Ok('') is the intentional "none"-tokenRef result
                // (connection.rs's resolve_route_token). moon-ws.js's
                // connect() -> LunaProtocol.buildWsUrl already skips the
                // token query param for a falsy value, so passing '' straight
                // through dials with NO token param - same falsy-token
                // contract every other builder in the app honors.
                try {
                  client.connect(wsUrl, token || null);
                } catch (_e) {
                  showNotice('Panel connection failed: could not open a connection to ' + describeUrlSafe(wsUrl));
                }
              }).catch(function (err) {
                if (myGen !== waterfallGen) return; // superseded while resolve_route_token rejected
                var reason = (err instanceof Error ? err.message : String(err));
                if (reason.indexOf('not-paired:') === 0) {
                  showNotice('Panel connection failed: route "' + route.key + '" is not paired - open Settings to pair it.');
                } else {
                  showNotice('Panel connection failed: could not resolve credentials for ' + describeUrlSafe(wsUrl));
                }
                // F1 (opus review, blocker): resolve_route_token failed
                // BEFORE client.connect() ever ran - the OLD socket (if any)
                // was NEVER torn down (moon-ws.js's client.connect() is the
                // ONLY teardown mechanism, and it never fired for this
                // attempt), so it is STILL genuinely in whatever state it was
                // before this attempt started. Repaint with the OLD label +
                // the CURRENT REAL state (never a hardcoded 'disconnected',
                // never this failed attempt's label) - a first-ever run has
                // no old label, so this hides the chip, same as chat.
                paintRouteIndicator(currentRouteLabel, currentConnected, currentEndpointDisplay);
              });
            } else {
              // No client.toml route configured - legacy load_connection
              // path, UNCHANGED (Step 1c Part 1 only retargets the route
              // branch above; this fallback keeps its existing credential
              // source).
              // Review residual (same family as the F1 blocker): entering the
              // fallback with a stale currentRouteLabel would let the legacy
              // socket's onOpen paint a route this socket is NOT on. No route
              // model here means no route name - hide the chip before dialing.
              paintRouteIndicator(null, false);
              ctx.invoke('load_connection').then(function (creds) {
                if (myGen !== waterfallGen) return; // superseded during load_connection
                if (creds && creds.wsUrl) {
                  try { client.connect(creds.wsUrl, creds.wsToken || null); } catch (_) { /* notice handled by caller */ }
                }
              }).catch(function () {
                if (myGen !== waterfallGen) return; // superseded while load_connection rejected
                if (hasTauri) {
                  // Tauri is present but load_connection rejected - surface a
                  // fixed reason (no url is in scope here to describe).
                  showNotice('Panel connection failed: could not load saved connection settings.');
                }
                // Off-Tauri: stay silent (expected in browser dev / jsdom).
              });
            }
          }).catch(function () {
            if (myGen !== waterfallGen) return; // superseded while resolveBootRoute rejected
            // resolveBootRoute itself rejected (shouldn't happen - MoonSession
            // catches internally, but belt-and-suspenders). Fall back to legacy.
            // Same no-route-model rule as the fallback above: hide the chip so
            // the legacy socket's onOpen cannot assert a stale route label.
            paintRouteIndicator(null, false);
            ctx.invoke('load_connection').then(function (creds) {
              if (myGen !== waterfallGen) return; // superseded during load_connection (fallback)
              if (creds && creds.wsUrl) {
                try { client.connect(creds.wsUrl, creds.wsToken || null); } catch (_) {}
              }
            }).catch(function () {
              if (myGen !== waterfallGen) return; // superseded while load_connection rejected (fallback)
              if (hasTauri) {
                showNotice('Panel connection failed: could not load saved connection settings.');
              }
            });
          });
        } else {
          // Legacy path (no MoonSession - off-Tauri / un-migrated / tests).
          // SYNCHRONOUS invocation preserved byte-identically from master so
          // that tests can assert ctx.invoke was called immediately after
          // connectWs().
          ctx.invoke('load_connection').then(function (creds) {
            if (myGen !== waterfallGen) return; // superseded during load_connection (legacy branch)
            if (creds && creds.wsUrl) {
              try { client.connect(creds.wsUrl, creds.wsToken || null); } catch (_) { /* notice handled by caller */ }
            }
          }).catch(function () {
            if (myGen !== waterfallGen) return; // superseded (legacy branch)
            /* off-Tauri */
          });
        }
      }

      runConnectWaterfall();

      // Step 1c Part 2: non-chat panels had NO hub_event listener at all, so
      // a route switch in Settings never reached them - the fan-out gap this
      // plan closes (chat windows already had this via wiring.ts's guarded
      // listener). Rust now fans profile-changed/connection-changed out to
      // every open window; react the same way here - client.connect() above
      // already tears its own prior socket down on every call, so re-running
      // the waterfall IS the clean teardown-and-reconnect.
      if (W && typeof W.listen === 'function') {
        W.listen('hub-event', function (e) {
          var p = e && e.payload;
          if (!p || p['for'] !== label) return; // targeted-event discipline
          if (p.name === 'profile-changed' || p.name === 'connection-changed') {
            runConnectWaterfall();
          }
        }).catch(function () {});
      }

      return client;
    },
  };

  // Hand-off point for React-owned panel types (see below): the deferred
  // module script (src/main-panel.tsx) runs after this inline script and
  // needs the same invoke bridge without re-deriving it from __TAURI__.
  window.__panelCtx = ctx;

  function bootModule(mod) {
    if (mod) {
      barTitle.textContent = mod.title;
      document.title = 'Luna - ' + mod.title;
      try {
        mod.render(contentArea, ctx);
      } catch (e) {
        showNotice('Panel failed to render: ' + (e && e.message ? e.message : String(e)));
      }
    } else {
      barTitle.textContent = 'Unknown panel';
      showNotice('Unknown panel type: "' + type + '"');
    }
    // Expose observability fields for agent-browser smoke and tests.
    // resolvedRouteKey: set by connectWs when a client.toml route is used.
    // lastNotice: set by showNotice - truthy means an error was surfaced.
    // viewMode (plan Step 3): LIVE accessors, not a snapshot - each method
    // closes over the real outer-scope state (declared near routeIndicatorEl,
    // above this IIFE's connectWs), so calling them after this object is
    // built keeps reading current truth even though this whole object is
    // itself a one-time snapshot assigned once, here.
    window.__PanelInternals = {
      type: type, hasModule: !!mod, resolvedRouteKey: null, resolvedRouteLabel: null, lastNotice: null,
      viewMode: {
        isEnabled: function () { return viewModeEnabled; },
        toggle: function () { setViewMode(!viewModeEnabled); return viewModeEnabled; },
        seam: viewModeSeam,
      },
    };
  }

  // React-owned panel types: rendered entirely by the deferred React module
  // below (main-panel.tsx -> src/panel-boot.tsx), which reuses window.__panelCtx
  // set above. Skip the legacy dynamic panels/<type>.js loader for these so
  // there's no vanilla-fetch-404/"Unknown panel type" flash before the module
  // mounts - this is what makes it safe to delete a converted type's old
  // frontend/panels/<type>.js source file once nothing else references it.
  var REACT_PANEL_TYPES = { flow: true, settings: true, 'settings-launcher': true, 'settings.general': true, agents: true, 'settings.skills': true, workflows: true, 'settings.apps': true, 'settings.voice': true, actions: true, 'settings.appearance': true, briefing: true, now: true, 'settings.models': true, 'settings.connection': true, 'settings.updates': true, 'settings.connectors': true, 'settings.vault': true };

  var registered = window.LunaPanelTypes && window.LunaPanelTypes[type];
  if (REACT_PANEL_TYPES[type]) {
    // Nothing to do here - src/panel-boot.tsx owns content-area/bar-title
    // for this type once the deferred module below runs.
  } else if (registered) {
    bootModule(registered);
  } else if (/^[a-z0-9.]+$/.test(type)) {
    var s = document.createElement('script');
    s.src = 'panels/' + type.replace(/\./g, '-') + '.js';
    s.onload = function () {
      bootModule((window.LunaPanelTypes && window.LunaPanelTypes[type]) || null);
    };
    s.onerror = function () { bootModule(null); };
    document.head.appendChild(s);
  } else {
    bootModule(null);
  }

  // Hand title-bar gestures directly to the native window drag.
  if (window.LunaDock) LunaDock.wire({ win: W, label: label });
})();
</script>
  <!-- React 19 + Astryx 0.1.8 boot layer (scaffold phase) - mounts an invisible
       boot probe alongside this page's unchanged vanilla content. See
       ../src/boot.tsx. Deferred module load: always runs after every
       classic-script above, including moon-appearance.js's pre-paint stamp. -->
  <script type="module" src="/src/main-panel.tsx"></script>
</body>
</html>
