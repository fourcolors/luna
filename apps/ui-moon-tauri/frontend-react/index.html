<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Moon Native Companion</title>
  
  <!-- Premium Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Albert+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Watercolor palette tokens (--paper, --ink, --wash-N, bridge tokens).
       Must come BEFORE the inline <style> so the palette's :root defaults
       are set, and hub rules that use the bridge tokens (--glass-bg, etc.)
       will pick up palette values wherever no hub-local override exists. -->
  <link rel="stylesheet" href="/vendor/moon-palette.css">

  <!-- Stamps data-palette/data-theme/data-chrome/data-grain on <html>
       pre-paint; re-applies live on cross-window localStorage storage events. -->
  <script src="/vendor/moon-appearance.js"></script>

  <!-- Shared protocol constants + WS frame registry (Phase 1 vendor
       modules). Loaded synchronously BEFORE the app script, which uses
       LunaProtocol/LunaWS at definition time. -->
  <script src="/vendor/moon-protocol.js"></script>
  <script src="/vendor/moon-ws.js"></script>

  <!-- Phase 2 C2: route-keyed boot helper.  Wraps the C3 Tauri commands
       (get_panel_route / list_routes / load_route) so boot can resolve the
       WS endpoint from client.toml instead of the shared luna_ws_url key.
       Degrades to null gracefully when Tauri is absent or no client.toml
       exists, letting the legacy load_connection path take over. -->
  <script src="/vendor/moon-session.js"></script>

  <!-- Phase 2 C6b/C8: PoolEngine helpers (DARK — luna_pool_engine flag).
       pool-engine.js: frame-tag isolation scaffold + gen-counter + isDarkFlagSet.
       moon-hub.js:    process-wide DeliveryBus + ConnectionPool + rebindAll
                       (C8 hub home).  Both are additive no-ops when the flag
                       is off; the default WebSocketEngine path is unaffected. -->
  <script src="/vendor/pool-engine.js"></script>
  <script src="/vendor/moon-hub.js"></script>

  <style>
    :root {
      /*
       * --font-display, --font-body, --font-hand, --radius,
       * --moon-glow, --moon-bright, --moon-shadow,
       * --glass-bg, --glass-border, --glass-glow,
       * --primary (alias for --accent), --bg, --text, --muted, --border
       * are all defined in vendor/moon-palette.css and must not be
       * duplicated here — the inline block comes later in cascade order
       * and would pin them to literal values, defeating the palette.
       *
       * SCOPE NOTE: the hub's painted UI (wizard card, crescent, glow)
       * intentionally keeps its hardcoded dark-glass literals — the moon
       * is a night object and the wizard pairs hardcoded-dark surfaces
       * with hardcoded-light text, so it stays self-consistent in every
       * palette. Only the fonts (+ --moon-glow) flow from the palette
       * here. Tokenizing the hub fully is deferred to the chat-extraction
       * cleanup that strips this monolith to hub-only chrome.
       */
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    
    /* Make the base window canvas transparent */
    html, body {
      background: rgba(0, 0, 0, 0.005) !important;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: var(--font-body);
      color: #f1f5f9;
      position: relative;
    }
    
    /* 
      Draggable Moon Widget 
      Adding data-tauri-drag-region tells Tauri to drag the native window 
      when clicking and dragging this element.
    */
    .needs-input-pip {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffe2ae, #f8c982 60%, #d99a3e);
      box-shadow: 0 0 8px 2px rgba(248, 201, 130, 0.55);
      z-index: 30;
      pointer-events: none;
      animation: pip-breathe 2.4s ease-in-out infinite;
    }
    @keyframes pip-breathe {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    /* Update pip (Slice C) — the needs-input-pip's calmer sibling: a soft glowing
       accent dot that lights when a verified build is staged. Same size/breathe,
       but the watercolor --accent glow instead of the amber needs-input tone, so
       it reads as a gentle "ready" cue rather than an alert. Sits just below the
       needs-input pip so both can show at once without overlapping. Unlike the
       needs-input pip it is pointer-events:auto + clickable — tapping it opens
       the Updates panel (the moon's own click still opens chat). */
    .update-pip {
      position: absolute;
      top: 30px;
      right: 16px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%,
        color-mix(in oklab, var(--accent) 92%, white),
        var(--accent) 60%,
        color-mix(in oklab, var(--accent) 70%, black) 100%);
      box-shadow: 0 0 8px 2px color-mix(in oklab, var(--accent) 55%, transparent);
      z-index: 31;
      cursor: pointer;
      pointer-events: auto;
      animation: pip-breathe 2.4s ease-in-out infinite;
    }

    .moon-container {
      position: absolute;
      left: 15px;
      top: 15px;
      width: 110px;
      height: 110px;
      cursor: grab;
      z-index: 100;
      touch-action: none;
    }
    
    .moon-container:active {
      cursor: grabbing;
    }
    
    .moon-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      pointer-events: auto; /* Active pointer events prevent click-through */
    }
    
    /* Always-on dark glow "pool" the moon sits in (subtle — the demo look, at a
       calm intensity so it's premium on a dark desktop without dimming a light
       one). Sized to fade FULLY to transparent before the window edge, so there's
       no hard rectangle; the dark pool is what makes the blue moon-glow read.
       --moon-aura-d scales it with the window. pointer-events none so it never
       eats the moon's drag region. */
    .moon-aura {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--moon-aura-d, 170px);
      height: var(--moon-aura-d, 170px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      /* `closest-side` is load-bearing: WITHOUT it `circle` defaults to
         farthest-corner, stretching the gradient ~40% past the element so its
         alpha is still non-zero at the small 140×185 window edge — the window
         then clips that into a hard dark RECTANGLE ("boxy glass"). closest-side
         pins 100% to the element's edge so the fade completes inside the window,
         leaving a clean circular pool with no box. */
      background: radial-gradient(circle closest-side,
        rgba(9, 12, 24, 0.35) 0%,
        rgba(9, 12, 24, 0.22) 30%,
        rgba(11, 16, 34, 0.08) 52%,
        rgba(11, 16, 34, 0) 72%);
    }

    /* Beautiful Atmospheric Glow */
    .moon-glow {
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      background: radial-gradient(circle, var(--moon-glow) 0%, rgba(138, 180, 248, 0) 70%);
      border-radius: 50%;
      opacity: 0.9;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1;
    }
    
    .moon-container:hover .moon-glow {
      opacity: 1;
      transform: scale(1.08);
    }
    
    /* Base Moon Sphere with transparency */
    .moon-sphere {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: transparent !important;
      box-shadow: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    
    /* Moon SVG Crescent shape styling */
    .moon-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 16px rgba(138, 180, 248, 0.45));
      transform: translate3d(var(--px, 0px), var(--py, 0px), 0) rotate(var(--rot, 0deg));
      transition: transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1),
                  filter 0.6s ease;   /* the detached dim fades, never snaps */
      pointer-events: auto;
    }

    /* ── Voice states on the moon (data-voice-state, set by VoiceEngine).
       Painterly like the bead: flat translucent washes, opacity + soft scale
       only — no gloss, no specular anything. The moon is 30px in a 140px
       window, so every effect here is deliberately quiet. ── */
    /* listening: a soft watercolor pulse on the glow; --voice-level (RMS 0–1,
       ~10 Hz from Rust) scales the pool so the moon visibly "hears" you. The
       glow's existing 0.3s transitions smooth the level steps. */
    .moon-wrapper[data-voice-state="listening"] .moon-glow {
      transform: scale(calc(1 + var(--voice-level, 0) * 0.28));
      animation: voice-listening-wash 2.8s ease-in-out infinite;
    }
    @keyframes voice-listening-wash {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 1; }
    }
    /* transcribing: a brief inward shimmer — the pool draws breath while
       whisper works. Fast cycle; the state itself only lasts a moment. */
    .moon-wrapper[data-voice-state="transcribing"] .moon-glow {
      animation: voice-transcribing-shimmer 0.9s ease-in-out infinite;
    }
    @keyframes voice-transcribing-shimmer {
      0%   { transform: scale(1.10); opacity: 0.55; }
      60%  { transform: scale(0.94); opacity: 0.95; }
      100% { transform: scale(1.02); opacity: 0.75; }
    }
    /* speaking: a gentle outward ripple — a blurred watercolor ring that
       feathers to nothing inside its own box (closest-side, the aura lesson)
       so it never clips into a hard edge. */
    .moon-wrapper[data-voice-state="speaking"]::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle closest-side,
        rgba(138, 180, 248, 0) 52%,
        rgba(138, 180, 248, 0.26) 72%,
        rgba(165, 148, 238, 0.10) 86%,
        rgba(138, 180, 248, 0) 100%);
      animation: voice-speaking-ripple 1.9s ease-out infinite;
    }
    @keyframes voice-speaking-ripple {
      0%   { transform: scale(0.72); opacity: 0; }
      30%  { opacity: 0.9; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    /* ── "Absorbed into the moon" pulse ──────────────────────────────────────
       Played when the workspace collapses INTO the orb (Rust emits moon-absorb
       after show()ing it). The widgets are separate OS windows so there is no
       true genie-suck across them; this quick swallow-and-settle on the orb is
       the cue that "it went into the moon." A class toggle (added on the event,
       removed on animationend) so it can replay every collapse. */
    .moon-wrapper.absorbing {
      animation: moon-absorb 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes moon-absorb {
      0%   { transform: scale(1.32); }
      55%  { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .moon-wrapper.absorbing .moon-glow {
      animation: moon-absorb-glow 0.5s ease-out both;
    }
    @keyframes moon-absorb-glow {
      0%   { opacity: 1; transform: scale(1.5); }
      100% { opacity: 0.85; transform: scale(1); }
    }

    /* Close-✕ chrome — survives the settings modal (Phase 6) because the
       wizard's ✕ reuses it (class="settings-x wizard-x"). */
    .settings-x {
      background: none; border: none; color: #64748b; cursor: pointer;
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: background 0.2s, color 0.2s;
    }
    .settings-x:hover { background: rgba(255, 255, 255, 0.06); color: #f1f5f9; }
    .settings-x svg { width: 16px; height: 16px; }

    /* Text-input chrome shared by the wizard's fields. */
    .premium-text-input {
      width: 100%;
      height: 32px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0 10px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    
    .premium-text-input:focus {
      border-color: rgba(138, 180, 248, 0.4);
      background: rgba(0, 0, 0, 0.45);
    }

    /* ════════════════════════════════════════════════════════════════════
       Setup Wizard — first-run guided install, in the moon's watercolor hand.
       Fixed full-window overlay: a plain rgba dim (NO backdrop-filter — on
       this transparent macOS WKWebView window backdrop-filter intermittently
       composites the whole surface to fully transparent after a repaint) over
       a solid dark-glass card. All the "watercolor" is pure CSS: layered
       off-center radial-gradients + an ORGANIC border-radius that a keyframe
       slowly morphs — the exact recipe the .moon-bead uses, so the wizard
       reads as the same brush. ══════════════════════════════════════════ */
    .wizard-panel {
      position: fixed;
      inset: 0;
      z-index: 320;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(4, 6, 14, 0.66);
      opacity: 0;
      pointer-events: none;
      /* visibility (delayed until the fade-out ends) keeps the hidden
         wizard out of the tab order — opacity alone leaves invisible
         buttons focusable for keyboard users. */
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0s linear 0.25s;
    }
    .wizard-panel.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transition: opacity 0.25s ease;
    }

    .wizard-card {
      position: relative;
      width: 100%;
      max-width: 600px;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: #0c1020;
      border-radius: 26px;
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 0 22px rgba(138, 180, 248, 0.05);
      overflow: hidden;
      transform: translateY(8px) scale(0.98);
      transition: transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .wizard-panel.active .wizard-card { transform: none; }

    /* Ambient watercolor wash: three big soft pigment pools drifting behind
       the content. Each blot is the moon-bead gradient at a larger scale and
       a lower opacity, with its own slow morph so the card never feels like
       a static dialog. pointer-events:none — pure paint. */
    .wizard-wash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .wash-blot {
      position: absolute;
      border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%;
      filter: blur(6px);
      animation: wash-drift 16s ease-in-out infinite alternate;
    }
    .wash-a {
      width: 340px; height: 300px;
      left: -120px; top: -110px;
      background:
        radial-gradient(circle closest-side,
          rgba(138, 180, 248, 0.14) 0%,
          rgba(118, 162, 240, 0.20) 55%,
          rgba(104, 146, 232, 0.10) 80%,
          rgba(104, 146, 232, 0) 100%),
        radial-gradient(circle at 64% 68%, rgba(165, 148, 238, 0.10) 0%, rgba(165, 148, 238, 0) 60%);
    }
    .wash-b {
      width: 300px; height: 280px;
      right: -120px; top: 30%;
      background:
        radial-gradient(circle closest-side,
          rgba(165, 148, 238, 0.12) 0%,
          rgba(150, 140, 235, 0.15) 50%,
          rgba(138, 180, 248, 0.07) 82%,
          rgba(138, 180, 248, 0) 100%);
      animation-delay: -6s;
      animation-duration: 19s;
    }
    .wash-c {
      width: 280px; height: 240px;
      left: 20%; bottom: -130px;
      background:
        radial-gradient(circle closest-side,
          rgba(126, 184, 240, 0.10) 0%,
          rgba(118, 162, 240, 0.14) 55%,
          rgba(96, 138, 226, 0) 100%);
      animation-delay: -11s;
      animation-duration: 22s;
    }
    @keyframes wash-drift {
      0%   { border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%; transform: translate(0, 0) rotate(0deg); }
      50%  { border-radius: 53% 47% 46% 54% / 45% 55% 48% 52%; transform: translate(14px, -10px) rotate(2deg); }
      100% { border-radius: 49% 51% 55% 45% / 54% 44% 52% 48%; transform: translate(-8px, 8px) rotate(-2deg); }
    }

    /* All real content floats above the wash. */
    .wizard-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      padding: 22px 26px 20px;
      overflow-y: auto;
    }
    .wizard-body::-webkit-scrollbar { width: 6px; }
    .wizard-body::-webkit-scrollbar-track { background: transparent; }
    .wizard-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }

    .wizard-x {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 2;
    }

    /* Step progress beads — tiny watercolor blots strung across the top.
       pending = faint outline pool; active = lit + shimmering; done = filled. */
    .wizard-beads {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 0 0;
    }
    .wizard-bead {
      width: 11px; height: 11px;
      border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%;
      background: rgba(138, 180, 248, 0.12);
      box-shadow: inset 0 0 0 1px rgba(138, 180, 248, 0.18);
      transition: background 0.3s, box-shadow 0.3s, transform 0.3s;
    }
    .wizard-bead.active {
      background:
        radial-gradient(circle closest-side,
          rgba(150, 188, 250, 0.5) 0%,
          rgba(118, 162, 240, 0.85) 70%,
          rgba(96, 138, 226, 0) 100%);
      box-shadow: 0 0 10px rgba(138, 180, 248, 0.45);
      transform: scale(1.25);
      animation: bead-pulse 2.4s ease-in-out infinite alternate;
    }
    .wizard-bead.done {
      background:
        radial-gradient(circle closest-side,
          rgba(138, 180, 248, 0.55) 0%,
          rgba(165, 148, 238, 0.6) 75%,
          rgba(165, 148, 238, 0) 100%);
      box-shadow: none;
    }
    @keyframes bead-pulse {
      from { border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%; }
      to   { border-radius: 53% 47% 45% 55% / 46% 54% 47% 53%; }
    }

    /* Steps: only the active one renders. */
    .wizard-step { display: none; }
    .wizard-step.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      animation: step-wash-in 0.35s ease;
    }
    @keyframes step-wash-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .wizard-step h2 {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      text-align: center;
      margin: 14px 0 6px;
    }
    .wizard-sub {
      font-size: 0.86rem;
      line-height: 1.5;
      color: #9fb0d0;
      text-align: center;
      max-width: 420px;
      margin: 0 auto 18px;
    }

    /* The welcome step's hero: a big watercolor moon blot. */
    .wizard-hero-blot {
      width: 96px; height: 96px;
      margin: 8px auto 0;
      border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%;
      background:
        radial-gradient(circle closest-side,
          rgba(150, 188, 250, 0.30) 0%,
          rgba(138, 180, 248, 0.40) 42%,
          rgba(118, 162, 240, 0.62) 68%,
          rgba(104, 146, 232, 0.78) 82%,
          rgba(96, 138, 226, 0.28) 92%,
          rgba(96, 138, 226, 0) 100%),
        radial-gradient(circle at 64% 68%, rgba(165, 148, 238, 0.25) 0%, rgba(165, 148, 238, 0) 60%),
        radial-gradient(circle at 32% 30%, rgba(126, 184, 240, 0.18) 0%, rgba(126, 184, 240, 0) 55%);
      box-shadow: 0 0 28px rgba(138, 180, 248, 0.30);
      animation: hero-wash 7s ease-in-out infinite alternate;
    }
    @keyframes hero-wash {
      from { border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%; }
      to   { border-radius: 52% 48% 46% 54% / 47% 55% 45% 53%; }
    }

    /* Path-choice cards: three painterly tiles. */
    .wizard-paths {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 6px 0 16px;
    }
    .wizard-path-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 12px 14px;
      background: rgba(255, 255, 255, 0.025);
      border: none;
      border-radius: 18px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      cursor: pointer;
      font-family: var(--font-body);
      text-align: center;
      transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.2s, background 0.2s;
    }
    .wizard-path-card:hover {
      transform: translateY(-3px);
      background: rgba(138, 180, 248, 0.06);
      box-shadow:
        inset 0 0 0 1px rgba(138, 180, 248, 0.35),
        0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 18px rgba(138, 180, 248, 0.12);
    }
    .wizard-path-title {
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    .wizard-path-desc {
      font-size: 0.72rem;
      line-height: 1.45;
      color: #8aa0c6;
    }

    /* Blot icon: a small pigment pool with a line glyph floating on it. */
    .wizard-blot-icon {
      position: relative;
      width: 52px; height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%;
      background:
        radial-gradient(circle closest-side,
          rgba(138, 180, 248, 0.22) 0%,
          rgba(118, 162, 240, 0.42) 60%,
          rgba(104, 146, 232, 0.18) 88%,
          rgba(104, 146, 232, 0) 100%),
        radial-gradient(circle at 62% 66%, rgba(165, 148, 238, 0.22) 0%, rgba(165, 148, 238, 0) 60%);
      animation: hero-wash 9s ease-in-out infinite alternate;
    }
    .wizard-blot-icon svg {
      width: 24px; height: 24px;
      stroke: #f0f6ff;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Form bits: reuse the premium text input look; labels match settings. */
    .wizard-field { margin: 0 0 12px; }
    .wizard-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #cdd9f5;
      margin-bottom: 6px;
    }
    .wizard-field .field-hint {
      display: block;
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 5px;
      line-height: 1.45;
    }

    /* Buttons: a primary watercolor wash pill + a quiet ghost. */
    .wizard-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: auto;
      padding-top: 16px;
    }
    .wizard-primary-btn {
      border: none;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 0.88rem;
      font-weight: 600;
      color: #0c1020;
      padding: 11px 26px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 30%, rgba(240, 247, 255, 0.55) 0%, rgba(240, 247, 255, 0) 55%),
        linear-gradient(135deg, #a6c6fa 0%, #8ab4f8 45%, #9a8ce6 100%);
      box-shadow: 0 4px 18px rgba(138, 180, 248, 0.35);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .wizard-primary-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(138, 180, 248, 0.5); }
    .wizard-primary-btn:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }
    .wizard-ghost-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: #8aa0c6;
      padding: 10px 14px;
      border-radius: 999px;
      transition: color 0.2s, background 0.2s;
    }
    .wizard-ghost-btn:hover { color: #e2e8f0; background: rgba(255, 255, 255, 0.05); }

    /* Copy-paste command block (remote path). */
    .wizard-cmd-block {
      position: relative;
      background: #0d1325;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      padding: 12px 14px;
      margin: 4px 0 10px;
    }
    .wizard-cmd-block pre {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.72rem;
      line-height: 1.55;
      color: #c8d6f5;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
      -webkit-user-select: text;
      padding-right: 58px;   /* keep the first line clear of the Copy button */
    }
    .wizard-copy-btn {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(138, 180, 248, 0.12);
      border: none;
      border-radius: 8px;
      color: #8ab4f8;
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .wizard-copy-btn:hover { background: rgba(138, 180, 248, 0.22); color: #f0f6ff; }

    /* Install progress: each task is a row with a blot bead that morphs while
       running, settles solid on success, and dries red on failure. */
    .wizard-tasks {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin: 6px 0 10px;
    }
    .wizard-task {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    .wizard-task-bead {
      flex-shrink: 0;
      width: 13px; height: 13px;
      border-radius: 47% 53% 51% 49% / 52% 46% 54% 48%;
      background: rgba(138, 180, 248, 0.1);
      box-shadow: inset 0 0 0 1px rgba(138, 180, 248, 0.18);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .wizard-task.running .wizard-task-bead {
      background:
        radial-gradient(circle closest-side,
          rgba(150, 188, 250, 0.5) 0%,
          rgba(118, 162, 240, 0.9) 70%,
          rgba(96, 138, 226, 0) 100%);
      box-shadow: 0 0 10px rgba(138, 180, 248, 0.5);
      animation: bead-pulse 1.1s ease-in-out infinite alternate;
    }
    .wizard-task.ok .wizard-task-bead {
      background:
        radial-gradient(circle closest-side,
          rgba(110, 222, 168, 0.55) 0%,
          rgba(74, 222, 128, 0.7) 70%,
          rgba(74, 222, 128, 0) 100%);
      box-shadow: none;
    }
    .wizard-task.fail .wizard-task-bead {
      background:
        radial-gradient(circle closest-side,
          rgba(252, 165, 165, 0.5) 0%,
          rgba(248, 113, 113, 0.7) 70%,
          rgba(248, 113, 113, 0) 100%);
      box-shadow: none;
    }
    .wizard-task-label {
      flex: 1;
      font-size: 0.8rem;
      color: #cdd9f5;
    }
    .wizard-task.fail .wizard-task-label { color: #fca5a5; }
    .wizard-task-note {
      font-size: 0.7rem;
      color: #64748b;
      max-width: 45%;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wizard-log {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.66rem;
      line-height: 1.5;
      color: #7d8db3;
      background: #0d1325;
      border-radius: 10px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      max-height: 110px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
      -webkit-user-select: text;
    }
    .wizard-log::-webkit-scrollbar { width: 6px; }
    .wizard-log::-webkit-scrollbar-track { background: transparent; }
    .wizard-log::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }

    /* Setup-mode note on the done step: server alive, Claude login still
       missing. Gold — the moon's "needs your input" color. Code spans inherit
       the dark chip look. */
    .wizard-setup-note {
      color: #fbbf24;
      font-size: 0.76rem;
      line-height: 1.7;
    }
    .wizard-setup-note code {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.72rem;
      background: #0d1325;
      border-radius: 6px;
      padding: 1px 6px;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Environment-detection note under the path cards ("Luna already lives
       here"). Same quiet-sub voice, success-tinted. */
    .wizard-detect-note {
      color: #4ade80;
      font-size: 0.76rem;
      margin-bottom: 10px;
    }

    /* "Advanced options" disclosure on the local step — defaults just work,
       the folder picker hides until summoned. */
    .wizard-advanced {
      margin: 2px 0 12px;
    }
    .wizard-advanced summary {
      cursor: pointer;
      list-style: none;
      font-size: 0.76rem;
      color: #8aa0c6;
      padding: 6px 2px;
      transition: color 0.2s;
    }
    .wizard-advanced summary::-webkit-details-marker { display: none; }
    .wizard-advanced summary::before {
      content: '▸';
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.2s;
    }
    .wizard-advanced[open] summary::before { transform: rotate(90deg); }
    .wizard-advanced summary:hover { color: #cdd9f5; }
    .wizard-advanced .wizard-field { margin-top: 10px; }

    /* Connection-test status line. */
    .wizard-connect-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 22px;
      font-size: 0.78rem;
      text-align: center;
      margin-top: 4px;
    }
    .wizard-connect-status.run  { color: #8ab4f8; }
    .wizard-connect-status.ok   { color: #4ade80; }
    .wizard-connect-status.fail { color: #f87171; }
  </style>
</head>
<body>

  <!-- React 19 + Astryx 0.1.8 mount point for the Moon hub shell (the
       draggable orb + its two ambient pips + the setup wizard). Every DOM
       node the vanilla script used to hand-build now comes from
       src/hub/MoonHubApp.tsx and its children (MoonOrb.tsx,
       SetupWizardPanel.tsx) - same class names/ids as before, so the
       watercolor <style> block above (kept verbatim) paints an identical
       result. See ../src/main-index.tsx. -->
  <div id="moon-hub-root"></div>

  <!-- Deferred module load: always runs after every classic vendor <script>
       above (moon-appearance.js's pre-paint stamp, moon-protocol.js,
       moon-ws.js, moon-session.js, pool-engine.js, moon-hub.js) - those
       globals are exactly what hubEngines.ts's HubController reads. -->
  <script type="module" src="/src/main-index.tsx"></script>
</body>
</html>
