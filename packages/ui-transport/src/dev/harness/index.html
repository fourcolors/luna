<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@luna/ui-transport — Multiroute Acceptance Harness</title>
  <style>
    /* ── reset + base ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-bg: #0f1117;
      --color-surface: #1a1d27;
      --color-surface-2: #22263a;
      --color-border: #2e3248;
      --color-text: #e2e8f0;
      --color-text-muted: #8892a4;
      --color-accent-luna: #6366f1;    /* indigo — Luna */
      --color-accent-hermes: #f59e0b;  /* amber — Hermes */
      --color-green: #22c55e;
      --color-red: #ef4444;
      --color-yellow: #eab308;
      --color-blue: #3b82f6;
      --color-radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── header ──────────────────────────────────────────────────────────── */
    .harness-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .harness-header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .harness-header .subtitle {
      color: var(--color-text-muted);
      font-size: 12px;
    }

    /* ── panels container ────────────────────────────────────────────────── */
    #panels-root {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
    }

    /* ── panel ───────────────────────────────────────────────────────────── */
    .panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--color-border);
      min-height: 0;
    }
    .panel:last-child { border-right: none; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      flex-shrink: 0;
    }
    .panel-label {
      font-weight: 600;
      font-size: 13px;
      flex: 1;
    }
    .close-btn {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 11px;
    }
    .close-btn:hover { color: var(--color-red); border-color: var(--color-red); }

    /* ── descriptor section ──────────────────────────────────────────────── */
    .panel-descriptor {
      padding: 14px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface-2);
      flex-shrink: 0;
    }
    .descriptor-placeholder {
      color: var(--color-text-muted);
      font-style: italic;
    }
    .descriptor-error {
      color: var(--color-red);
    }

    .descriptor-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .server-name {
      font-size: 16px;
      font-weight: 700;
    }
    .server-version {
      font-size: 11px;
      color: var(--color-text-muted);
      font-family: monospace;
    }

    /* kind badges */
    .kind-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .kind-badge--luna-chat-server {
      background: color-mix(in srgb, var(--color-accent-luna) 20%, transparent);
      color: var(--color-accent-luna);
      border: 1px solid var(--color-accent-luna);
    }
    .kind-badge--hermes {
      background: color-mix(in srgb, var(--color-accent-hermes) 20%, transparent);
      color: var(--color-accent-hermes);
      border: 1px solid var(--color-accent-hermes);
    }
    .kind-badge--unknown {
      background: color-mix(in srgb, var(--color-text-muted) 20%, transparent);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
    }

    /* origin badge */
    .origin-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      font-family: monospace;
    }
    .origin-badge--server-emitted {
      color: var(--color-green);
      border-color: var(--color-green);
      background: color-mix(in srgb, var(--color-green) 10%, transparent);
    }
    .origin-badge--client-projected {
      color: var(--color-yellow);
      border-color: var(--color-yellow);
      background: color-mix(in srgb, var(--color-yellow) 10%, transparent);
    }

    /* health */
    .health {
      font-size: 11px;
      margin: 4px 0 8px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .health--normal { background: color-mix(in srgb, var(--color-green) 15%, transparent); color: var(--color-green); }
    .health--error  { background: color-mix(in srgb, var(--color-red) 15%, transparent);   color: var(--color-red);   }
    .health--degraded { background: color-mix(in srgb, var(--color-yellow) 15%, transparent); color: var(--color-yellow); }

    /* capabilities */
    .descriptor-content h4 {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .caps-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .caps-list li {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
    }
    .cap--available   { background: color-mix(in srgb, var(--color-green) 12%, transparent); color: var(--color-green); }
    .cap--unavailable { background: color-mix(in srgb, var(--color-red) 12%, transparent); color: var(--color-red); }

    /* ── rollback button ─────────────────────────────────────────────────── */
    /*
     * THE VISUAL DIFFERENTIATOR:
     *   Luna panel → rollback-btn is rendered (update.revertible=true)
     *   Hermes panel → rollback-container is empty (update.revertible=false)
     */
    .rollback-container {
      padding: 0 14px;
      min-height: 40px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .rollback-btn {
      background: color-mix(in srgb, var(--color-red) 15%, transparent);
      border: 1px solid var(--color-red);
      color: var(--color-red);
      padding: 5px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .rollback-btn:hover {
      background: color-mix(in srgb, var(--color-red) 30%, transparent);
    }

    /* ── connection dot ──────────────────────────────────────────────────── */
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot--connecting { background: var(--color-yellow); animation: pulse 1s infinite; }
    .dot--ready      { background: var(--color-green); }
    .dot--down, .dot--handshake-timeout, .dot--auth-failed, .dot--identity-failed, .dot--route-missing
                     { background: var(--color-red); }
    .dot--recovering { background: var(--color-yellow); }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

    /* ── chat ────────────────────────────────────────────────────────────── */
    .panel-chat {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 120px;
    }
    .chat-msg {
      max-width: 90%;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg--user {
      background: color-mix(in srgb, var(--color-blue) 20%, transparent);
      border: 1px solid var(--color-blue);
      align-self: flex-end;
      color: var(--color-text);
    }
    .chat-msg--assistant {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      align-self: flex-start;
      color: var(--color-text);
    }
    .chat-msg--system {
      background: color-mix(in srgb, var(--color-text-muted) 15%, transparent);
      border: 1px solid var(--color-border);
      align-self: center;
      color: var(--color-text-muted);
      font-style: italic;
      font-size: 11px;
    }
    .chat-msg--error {
      background: color-mix(in srgb, var(--color-red) 15%, transparent);
      border: 1px solid var(--color-red);
      align-self: flex-start;
      color: var(--color-red);
    }
    .chat-controls {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: 5px;
      color: var(--color-text);
      padding: 6px 10px;
      font-size: 13px;
    }
    .chat-input:focus { outline: none; border-color: var(--color-blue); }
    .chat-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .send-btn {
      background: var(--color-accent-luna);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── fatal error ──────────────────────────────────────────────────────── */
    .fatal-error {
      margin: 40px auto;
      max-width: 600px;
      padding: 20px;
      background: color-mix(in srgb, var(--color-red) 10%, transparent);
      border: 1px solid var(--color-red);
      border-radius: 8px;
      color: var(--color-red);
    }
  </style>
</head>
<body>
  <div class="harness-header">
    <h1>@luna/ui-transport — Multiroute Acceptance Harness</h1>
    <span class="subtitle">Two panels · Two routes · Two descriptor origins · One rollback button</span>
  </div>

  <div id="panels-root">
    <!-- Panels are injected here by harness.ts -->
  </div>

  <!--
    serve.ts injects window.__HARNESS_CONFIG__ before this script tag.
    harness.ts reads it to get the stub URLs and tokens.
  -->
  <script type="module" src="./harness.ts"></script>
</body>
</html>
