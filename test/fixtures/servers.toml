# test/fixtures/servers.toml — GOLDEN FIXTURE for luna-registry.sh unit tests.
#
# Phase 1b: stable stanza now reflects the REAL runtime (incus luna-stable).
# The 1b.2 golden assertion flips from "--repo-dir" to "--incus luna-stable".
# The dev stanza is unchanged.
#
# Mode note: in production /etc/luna/servers.toml must be 0600. The test harness
# uses LUNA_TEST_STAT_MODE to simulate permission checks without chmod.

kind          = "registry"
schemaVersion = 1
host          = "test-box"

# stable: incus luna-stable → P_INCUS="luna-stable" → --incus flag
[[server]]
name        = "stable"
description = "stable golden fixture"
enabled     = true

update.params.hostRepoDir              = "/root/luna/stable/repo"
update.params.ref                      = "origin/master"
runtime.target.incus.container         = "luna-stable"
runtime.target.incus.containerRepoDir  = "/root/luna"

ports.proxy = 4753

# Auto-update default-on: stable ships with a 15min timer; deploy.autoUpdate
# is deliberately ABSENT here so tests exercise the absent-key → "true" default.
deploy.timer         = true
deploy.timerInterval = "15min"

# dev: incus luna-dev → P_INCUS="luna-dev" → --incus flag
[[server]]
name        = "dev"
description = "dev golden fixture"
enabled     = true

update.params.hostRepoDir      = "/root/luna/dev/repo"
update.params.ref              = "origin/dev"
runtime.target.incus.container = "luna-dev"

ports.proxy = 4753

deploy.timer = true
