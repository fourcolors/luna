# Luna CI
#
# HARD GATES (these MUST stay green - a red here blocks the merge):
#   1. bun install --frozen-lockfile  - fails the build if bun.lock is out of
#      sync with package.json. This is the exact failure that reached master
#      (lockfile drift); the frozen install would have caught it. NOTE: a PR
#      that predates a dependency bump trips this on the MERGE ref even when
#      both branches are individually consistent. Rebase, do not regenerate.
#   2. secret-scan                    - greps tracked files for high-entropy
#      secrets (bare 64-hex WS tokens, real `sk-ant-` keys, access/refresh
#      token literals). Tuned to catch a leaked 64-hex WS token in a .md
#      WITHOUT tripping on the legitimate `sk-ant-oat-totally-bogus` test
#      fixtures / redaction docs in the repo.
#   3. Moon version sync              - see the inline comment on its step.
#   4. Server version sync            - see the inline comment on its step.
#   5. Moon WS-contract harness       - apps/ui-moon-tauri/test/ws-contract.test.ts
#      drives frontend-react/chat.html's WebSocketEngine (reconnect backoff,
#      connGen supersession, thread-switch resubscribe) through a scriptable
#      FakeWebSocket double under realistic async timing. Task #45 of the Moon
#      stability-audit batch - the prior stub never fired real events, so
#      reconnect/thread-switch races were never exercised. Kept as its OWN gate
#      (it predates gate 6) so this seam stays individually named.
#   6. test - vitest                  - the vitest suite, minus the host-env
#      suites carved into their own non-blocking step (HOST_ENV_TESTS in
#      vitest.config.ts). Promoted at master 1df40f68, the first time the suite
#      reached 0 failures. 403 of 406 test files are gated; the 3 carved out
#      are the ops-script suites that read the host machine.
#
# TEST RUNNERS - Luna's suite runs under TWO runners, and CI runs BOTH
# (see TESTING.md). This split is the fix for the bun:sqlite FALSE failures:
#   - `bun run test`     (vitest) - most suites. The bun:sqlite-backed suites
#     are excluded here (vitest.config.ts BUN_RUNTIME_TESTS) because vitest's
#     Node/vite pipeline cannot load `bun:sqlite`.
#   - `bun run test:bun` (bun)    - the bun:sqlite-backed suites (DuckDbService /
#     analytics / telemetry / wake + memory / vault). vitest cannot load
#     bun:sqlite, so without this step their coverage is silently dropped.
#   - `bun run test:hostenv`      - the host-environment suites, opted back in
#     via LUNA_TEST_HOST_ENV=1.
#
# SURFACED, NOT BLOCKING (continue-on-error):
#   - typecheck - was a documented pre-existing `tsc` baseline (4 errors in
#     packages/thread-tools/src/layer.ts). Fixed in #385, so this is GREEN now;
#     left non-blocking only because nothing has re-verified it across a few
#     merges yet. Promote it once it has held.
#   - test:bun - currently green (1797 pass). Next promotion candidate.
#   - test:hostenv - genuinely host-dependent (incus / tailscale / launchd /
#     systemd profile state). Giving each a hermetic fixture root is the
#     follow-up that would let them join gate 6.
#
# HISTORY, so the "macOS-only" excuse does not come back: the vitest step was
# non-blocking for a long time on the theory that keychain-helper /
# deploy-scripts / ui-models "genuinely can't run on linux". Of the 14 failures
# standing when the gate was finally flipped, ZERO were macOS-only:
#   - ui-models had gone stale against the #387 model catalog. Pure logic.
#   - the Moon drag assertions had gone stale against the hard-promote rework.
#   - the send-path tests were genuinely broken (never seeded a socket).
#   - keychain-helper's units were not macOS-only either: the helper exposes a
#     `_platform` injection seam and four tests simply forgot to use it, so they
#     inherited process.platform. They now pin it and run everywhere.
#   - three ui-web suites were failing at COLLECTION on any machine without
#     UI_WS_TOKEN set, which has nothing to do with the OS.
# A gate nobody has to satisfy collects rot. Do not re-add continue-on-error to
# gate 6; carve a genuinely environment-dependent file into HOST_ENV_TESTS
# instead, and say why.
#
# Rationale: lockfile drift and leaked secrets are correctness/safety issues
# that reached master with no automated guard, so they hard-gate. The rest is
# surfaced and ratcheted to green over time.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, jax-box]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the depth-1 default: the guardian
          # engine-preservation test (test/releases-layout.test.ts) extracts
          # the pinned pre-phase-4 engine via `git show <commit>:<path>`,
          # which a shallow checkout cannot serve.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin to the bun that wrote bun.lock. The repo uses the TEXT lockfile
          # ("lockfileVersion": 1 JSON), which requires bun >= 1.2 — bun 1.1.x
          # uses the binary bun.lockb and would make --frozen-lockfile below
          # fail for the wrong reason. (engines says >=1.1.0, but the lockfile
          # format is the binding constraint.)
          bun-version: "1.3.14"

      # HARD GATE 1: lockfile drift. --frozen-lockfile errors if bun.lock does
      # not match package.json instead of silently rewriting it.
      - name: Install (frozen lockfile — HARD GATE)
        run: bun install --frozen-lockfile

      # HARD GATE 2: secret scan over GIT-TRACKED files only.
      # We feed `git ls-files` into grep so the scan surface is exactly what is
      # committed — this is reproducible on a fresh checkout and naturally
      # excludes node_modules/, dist/, build artifacts (e.g. Rust `target/`),
      # and anything gitignored. We additionally drop the lockfile, which
      # carries hex-ish integrity hashes. Aggregates hits across patterns and
      # fails once at the end.
      - name: Secret scan (HARD GATE)
        run: |
          set -uo pipefail
          # Scan surface = git-tracked files only (reproducible on a fresh
          # checkout; excludes node_modules/, dist/, build artifacts like Rust
          # target/, and anything gitignored). git itself drops lockfiles via
          # the `:!*.lock` pathspec (bun.lock carries hex-ish integrity hashes).
          # `git ls-files -z | xargs -0 grep` is portable across BSD/GNU and
          # avoids ARG_MAX on large trees.
          echo "secret-scan: scanning $(git ls-files -- ':!*.lock' | wc -l | tr -d ' ') tracked files"

          fail=0
          scan() { # $1=label  $2=ERE pattern
            local label="$1" pat="$2" out
            out=$(git ls-files -z -- ':!*.lock' | xargs -0 grep -HInE "$pat" 2>/dev/null) || true
            if [ -n "$out" ]; then
              echo "::error::secret-scan tripped [$label]"
              echo "$out"
              fail=1
            else
              echo "ok [$label]"
            fi
          }

          # (a) Bare high-entropy hex run (>=40). Catches this session's leaked
          #     WS bearer tokens (64-hex in backticks in a .md). The repo has
          #     NO legitimate >=40-hex strings outside the (excluded) lockfile.
          scan "hex-run"          '[0-9a-f]{40,}'
          # (b) Spec's token-adjacent hex (kept as a complementary signal; on
          #     its own it MISSES the real leak, which had words between
          #     "tokens" and the hex — hence (a) above is the primary guard).
          scan "token-adjacent"   "(token|TOKEN)[\"': =]+[0-9a-f]{40,}"
          # (c) Real Anthropic keys: sk-ant- followed by a long high-entropy
          #     run. Does NOT match the short hyphenated `sk-ant-oat-totally-
          #     bogus-...` test fixtures / redaction docs already in the repo.
          scan "sk-ant-key"       'sk-ant-[A-Za-z0-9]{4,}[A-Za-z0-9_-]{30,}'
          # (d) access/refresh token literals assigned a long value (not the
          #     bare identifiers, which can legitimately appear in code).
          scan "token-literal"    "(accessToken|refreshToken)[\"': =]+[A-Za-z0-9_.-]{20,}"

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Secret scan FAILED. A high-entropy secret appears in a tracked file."
            echo "Scrub it from the working tree AND git history, rotate the secret, then re-push."
            exit 1
          fi
          echo "Secret scan clean."

      # HARD GATE 3: Moon version triple stays in lockstep. The Tauri version
      # lives in THREE files (apps/ui-moon-tauri package.json + src-tauri
      # Cargo.toml + tauri.conf.json). If they drift, the macOS release build
      # (release-moon.yml) fails AFTER an irreversible `moon-v*` tag push. Catch
      # the drift here, on every PR, before any tag exists. `bump-moon.ts` is the
      # single writer that keeps the three in sync.
      - name: Moon version sync (HARD GATE)
        run: bun run scripts/bump-moon.ts --check

      # HARD GATE 4: the server release version (server.version.json) is valid
      # semver. The `server-v*` tag the release pipeline cuts is derived from this
      # file; an invalid/missing version would otherwise only surface AFTER an
      # irreversible tag push (release-server.yml's coherence guard). Catch it here
      # on every PR. `bump-server.ts` is the single writer of this file.
      - name: Server version sync (HARD GATE)
        run: bun run scripts/bump-server.ts --check

      # KNOWN-RED (surfaced, not blocking): pre-existing tsc baseline.
      - name: Typecheck (known-red baseline — non-blocking)
        continue-on-error: true
        run: bun run typecheck

      # HARD GATE 5: Moon WS-contract harness (task #45, Moon stability-audit
      # batch). Now a SUBSET of gate 6 below, kept as its own named step so this
      # specific seam stays individually visible in the checks list and fails
      # fast (2s) rather than after the full suite. It predates gate 6, which is
      # why it exists separately at all.
      - name: Test — Moon WS-contract harness (HARD GATE)
        run: bun run test -- apps/ui-moon-tauri/test/ws-contract.test.ts

      # HARD GATE 6: the whole vitest suite. Promoted from non-blocking once the
      # suite reached 0 failures for the first time (master 1df40f68). It had
      # been continue-on-error to tolerate a "macOS-only" baseline, and that
      # tolerance is exactly what let real rot accumulate unseen: of the 14
      # failures standing when this was flipped, ZERO were macOS-only. They were
      # stale assertions (ui-models vs the #387 catalog, Moon drag assertions vs
      # the hard-promote rework) plus genuinely broken send-path tests.
      #
      # The one true Darwin dependency in the whole suite is a single
      # `plutil -lint` case in test/deploy-scripts.test.ts, now guarded with
      # it.skipIf(process.platform !== "darwin") so it still runs on macOS and
      # skips here. keychain-helper and vault-migrate-keychain were also listed
      # as macOS-only and never were - both are pure/mocked with no subprocess
      # spawns at all.
      #
      # If this gate goes red, FIX THE TEST OR THE CODE. Do not re-add
      # continue-on-error; that is what produced the backlog this replaced.
      #
      # UI_WS_TOKEN: chat-server.ts calls resolveUiWsToken() at MODULE IMPORT
      # time (chat-server.ts:467), so merely importing it for a pure helper
      # throws when the var is unset - which silently broke three ui-web suites
      # at collection on any machine without it in the environment. This is a
      # throwaway CI value, not a secret: the suites never open a socket, they
      # import the module for functions like buildAvailableModels. The real fix
      # is to make that resolution lazy so importing the module has no side
      # effect; tracked as a follow-up.
      - name: Test — vitest (HARD GATE)
        env:
          UI_WS_TOKEN: ci-dummy-ui-ws-token-not-a-secret
        run: bun run test

      # Surfaced, NON-BLOCKING: the host-environment suites (see the
      # HOST_ENV_TESTS note in vitest.config.ts). They shell out to the ops
      # scripts, which read the host. Note this runner IS a real Luna
      # deployment host, so guardian/update-server see genuine profile state
      # and fail with "already adopted stable" - they are reading the machine,
      # not a fixture. Kept visible so the coverage is not forgotten, and
      # deliberately NOT folded back into the gate above; carrying them there
      # is what kept the whole suite non-blocking.
      - name: Test — host-env suites (non-blocking)
        continue-on-error: true
        run: bun run test:hostenv

      # Surfaced, NON-BLOCKING. The bun:sqlite-backed suites' ONLY coverage —
      # vitest cannot load bun:sqlite. (Whole-package run, so a few macOS-only
      # tests in these packages are also red on the Linux runner; see TESTING.md.)
      - name: Test — bun:sqlite suites (non-blocking)
        continue-on-error: true
        run: bun run test:bun
