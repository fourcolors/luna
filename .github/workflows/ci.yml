# Luna CI
#
# HARD GATES (these MUST stay green — a red here blocks the merge):
#   1. bun install --frozen-lockfile  — fails the build if bun.lock is out of
#      sync with package.json. This is the exact failure that reached master
#      this session (lockfile drift); the frozen install would have caught it.
#   2. secret-scan                    — greps tracked files for high-entropy
#      secrets (bare 64-hex WS tokens, real `sk-ant-` keys, access/refresh
#      token literals). Tuned to catch this session's leaked WS token
#      (`master \`2349697a…\`` in a .md) WITHOUT tripping on the legitimate
#      `sk-ant-oat-totally-bogus` test fixtures / redaction docs in the repo.
#
# TEST RUNNERS — Luna's suite runs under TWO runners, and CI runs BOTH
# (see TESTING.md). This split is the fix for the bun:sqlite FALSE failures:
#   - `bun run test`     (vitest) — most suites. The bun:sqlite-backed suites
#     are excluded here (vitest.config.ts BUN_RUNTIME_TESTS) because vitest's
#     Node/vite pipeline cannot load `bun:sqlite`.
#   - `bun run test:bun` (bun)    — the bun:sqlite-backed suites (DuckDbService /
#     analytics / telemetry / wake + memory / vault). vitest cannot load
#     bun:sqlite, so without this step their coverage is silently dropped.
#
# KNOWN-RED (surfaced, but NOT allowed to fail the build yet — continue-on-error):
#   - typecheck — DOCUMENTED pre-existing `tsc` baseline.
#   - test — the bun:sqlite FALSE failures are gone (excluded from vitest, run
#     under Bun), but a SEPARATE macOS-only baseline remains RED on the Linux CI
#     runner: keychain-helper (macOS Keychain), deploy-scripts (plutil/launchd),
#     and apps/ui-web ui-models. Those genuinely can't run on linux. Both
#     runners run for visibility; gating them is deferred until those suites are
#     guarded for non-Darwin (tracked follow-up — see TESTING.md).
#
# Rationale: lockfile drift and leaked secrets are correctness/safety issues
# that reached master with no automated guard, so they hard-gate. typecheck and
# the test runners are surfaced and ratcheted to green over time.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, jax-box]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin to the bun that wrote bun.lock. The repo uses the TEXT lockfile
          # ("lockfileVersion": 1 JSON), which requires bun >= 1.2 — bun 1.1.x
          # uses the binary bun.lockb and would make --frozen-lockfile below
          # fail for the wrong reason. (engines says >=1.1.0, but the lockfile
          # format is the binding constraint.)
          bun-version: "1.3.14"

      # HARD GATE 1: lockfile drift. --frozen-lockfile errors if bun.lock does
      # not match package.json instead of silently rewriting it.
      - name: Install (frozen lockfile — HARD GATE)
        run: bun install --frozen-lockfile

      # HARD GATE 2: secret scan over GIT-TRACKED files only.
      # We feed `git ls-files` into grep so the scan surface is exactly what is
      # committed — this is reproducible on a fresh checkout and naturally
      # excludes node_modules/, dist/, build artifacts (e.g. Rust `target/`),
      # and anything gitignored. We additionally drop the lockfile, which
      # carries hex-ish integrity hashes. Aggregates hits across patterns and
      # fails once at the end.
      - name: Secret scan (HARD GATE)
        run: |
          set -uo pipefail
          # Scan surface = git-tracked files only (reproducible on a fresh
          # checkout; excludes node_modules/, dist/, build artifacts like Rust
          # target/, and anything gitignored). git itself drops lockfiles via
          # the `:!*.lock` pathspec (bun.lock carries hex-ish integrity hashes).
          # `git ls-files -z | xargs -0 grep` is portable across BSD/GNU and
          # avoids ARG_MAX on large trees.
          echo "secret-scan: scanning $(git ls-files -- ':!*.lock' | wc -l | tr -d ' ') tracked files"

          fail=0
          scan() { # $1=label  $2=ERE pattern
            local label="$1" pat="$2" out
            out=$(git ls-files -z -- ':!*.lock' | xargs -0 grep -HInE "$pat" 2>/dev/null) || true
            if [ -n "$out" ]; then
              echo "::error::secret-scan tripped [$label]"
              echo "$out"
              fail=1
            else
              echo "ok [$label]"
            fi
          }

          # (a) Bare high-entropy hex run (>=40). Catches this session's leaked
          #     WS bearer tokens (64-hex in backticks in a .md). The repo has
          #     NO legitimate >=40-hex strings outside the (excluded) lockfile.
          scan "hex-run"          '[0-9a-f]{40,}'
          # (b) Spec's token-adjacent hex (kept as a complementary signal; on
          #     its own it MISSES the real leak, which had words between
          #     "tokens" and the hex — hence (a) above is the primary guard).
          scan "token-adjacent"   "(token|TOKEN)[\"': =]+[0-9a-f]{40,}"
          # (c) Real Anthropic keys: sk-ant- followed by a long high-entropy
          #     run. Does NOT match the short hyphenated `sk-ant-oat-totally-
          #     bogus-...` test fixtures / redaction docs already in the repo.
          scan "sk-ant-key"       'sk-ant-[A-Za-z0-9]{4,}[A-Za-z0-9_-]{30,}'
          # (d) access/refresh token literals assigned a long value (not the
          #     bare identifiers, which can legitimately appear in code).
          scan "token-literal"    "(accessToken|refreshToken)[\"': =]+[A-Za-z0-9_.-]{20,}"

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Secret scan FAILED. A high-entropy secret appears in a tracked file."
            echo "Scrub it from the working tree AND git history, rotate the secret, then re-push."
            exit 1
          fi
          echo "Secret scan clean."

      # HARD GATE 3: Moon version triple stays in lockstep. The Tauri version
      # lives in THREE files (apps/ui-moon-tauri package.json + src-tauri
      # Cargo.toml + tauri.conf.json). If they drift, the macOS release build
      # (release-moon.yml) fails AFTER an irreversible `moon-v*` tag push. Catch
      # the drift here, on every PR, before any tag exists. `bump-moon.ts` is the
      # single writer that keeps the three in sync.
      - name: Moon version sync (HARD GATE)
        run: bun run scripts/bump-moon.ts --check

      # HARD GATE 4: Studio version quadruple stays in lockstep, same story as
      # HARD GATE 3 above but for apps/ui-studio-tauri (package.json +
      # src-tauri Cargo.toml/tauri.conf.json/Cargo.lock). Drift would only
      # surface AFTER an irreversible `studio-v*` tag push (release-studio.yml).
      # `bump-studio.ts` is the single writer that keeps the four in sync.
      - name: Studio version sync (HARD GATE)
        run: bun run scripts/bump-studio.ts --check

      # HARD GATE 5: the server release version (server.version.json) is valid
      # semver. The `server-v*` tag the release pipeline cuts is derived from this
      # file; an invalid/missing version would otherwise only surface AFTER an
      # irreversible tag push (release-server.yml's coherence guard). Catch it here
      # on every PR. `bump-server.ts` is the single writer of this file.
      - name: Server version sync (HARD GATE)
        run: bun run scripts/bump-server.ts --check

      # KNOWN-RED (surfaced, not blocking): pre-existing tsc baseline.
      - name: Typecheck (known-red baseline — non-blocking)
        continue-on-error: true
        run: bun run typecheck

      # Surfaced, NON-BLOCKING (see header). The bun:sqlite FALSE failures are
      # gone (excluded from vitest → run under Bun below), but a macOS-only
      # baseline (keychain-helper / deploy-scripts / ui-models) stays red on the
      # Linux runner, so vitest is not a hard gate yet.
      - name: Test — vitest (non-blocking)
        continue-on-error: true
        run: bun run test

      # Surfaced, NON-BLOCKING. The bun:sqlite-backed suites' ONLY coverage —
      # vitest cannot load bun:sqlite. (Whole-package run, so a few macOS-only
      # tests in these packages are also red on the Linux runner; see TESTING.md.)
      - name: Test — bun:sqlite suites (non-blocking)
        continue-on-error: true
        run: bun run test:bun
