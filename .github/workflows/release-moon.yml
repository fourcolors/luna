# Release Moon — builds the Luna Moon desktop app and publishes a GitHub Release
# with the Tauri v2 auto-updater artifacts (.app.tar.gz + .sig + latest.json).
#
# TWO ways to release, both land in this ONE workflow run:
#   1. Tag push — `git push origin moon-v0.0.40` (e.g. the local
#      `bump-moon.ts <ver> --tag --push` path). Builds the already-tagged commit.
#   2. The button — Actions ▸ "Release Moon" ▸ Run workflow ▸ enter a version.
#      The run BUMPS all four version files in lockstep, commits them to master,
#      tags `moon-v<version>`, pushes both, then builds — no local Mac, no git
#      ritual, no Cargo.lock hand-edit. This is the recommended path.
#
# Why one workflow and not a separate "cut" workflow that pushes a tag: a tag
# pushed using the in-run GITHUB_TOKEN does NOT trigger another workflow
# (`on: push: tags`) — so a split design would push the tag and the build would
# silently never fire. Doing the bump+tag+build in a single run sidesteps that
# entirely (no PAT / deploy key needed). The master push is allowed because this
# workflow grants `contents: write` and `actions/checkout` persists the token.
#
# SEPARATE from ci.yml (which runs on push/PR, not tags) so the two never overlap.
#
# Prereqs (one-time): repo secrets TAURI_SIGNING_PRIVATE_KEY +
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the updater minisign keypair). The matching
# public key is baked into apps/ui-moon-tauri/src-tauri/tauri.conf.json
# (plugins.updater.pubkey). No Apple notarization yet — the bundle is ad-hoc
# signed (committed tauri.conf bundle.macOS.signingIdentity is "-"; see
# apps/ui-moon-tauri/docs/macos-local-rebuild.md — null skips codesign and
# leaves Info.plist unbound so ATS / Local Network purpose strings are ignored).
#
# NOTE: editing this file requires pushing over the SSH remote — the gh HTTPS
# token lacks the `workflow` scope.

name: Release Moon

on:
  push:
    tags:
      - "moon-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release as x.y.z (bumps all 4 files, commits to master, tags moon-v<version>, then builds + publishes)"
        required: true
        type: string

permissions:
  contents: write # tauri-action needs this to create the Release; the cut step also pushes the bump commit to master

jobs:
  release-moon:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match ci.yml / the bun that wrote the text lockfile.
          bun-version: "1.3.14"

      # Resolve the tag once so every later step is trigger-agnostic:
      #   - tag push:        the pushed ref (github.ref_name = moon-v0.0.40)
      #   - workflow_dispatch: moon-v<input.version> (the cut step creates it)
      - name: Resolve release tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=moon-v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # workflow_dispatch only: turn a bare version into a tagged, pushed commit.
      # bump-moon.ts rewrites all four version files atomically (and validates the
      # x.y.z shape — a bad value exits non-zero and fails the run before anything
      # is committed). We then commit to master + tag + push both; the build below
      # runs on this exact working tree.
      - name: Cut version, commit + tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euxo pipefail
          # Refuse a re-used tag up front (mirrors bump-moon.ts --tag's guard).
          if git ls-remote --exit-code --tags origin "refs/tags/moon-v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag moon-v${VERSION} already exists on origin — pick a new version"
            exit 1
          fi
          bun run scripts/bump-moon.ts "${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(ui-moon-tauri): bump to ${VERSION}"
          git tag -a "moon-v${VERSION}" -m "Luna Moon ${VERSION}"
          # Push the bump to master first so the remote tag resolves to it, then
          # the tag. (A GITHUB_TOKEN push won't trigger ci.yml — fine, no double run.)
          git push origin HEAD:master
          git push origin "moon-v${VERSION}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/ui-moon-tauri/src-tauri

      - name: Install JS deps (frozen lockfile)
        run: bun install --frozen-lockfile

      # The committed tauri.conf.json uses ad-hoc signingIdentity "-" so a local
      # `tauri build` / `bun run install:macos` binds Info.plist (required for
      # ATS + NSLocalNetworkUsageDescription — see docs/macos-local-rebuild.md).
      # CI rewrites the same value explicitly for defense in depth and to keep
      # minimumSystemVersion if someone changes the committed identity later.
      # Updater trust is minisign (independent of Apple signing).
      # The rewrite must PRESERVE minimumSystemVersion: tauri exports it as
      # MACOSX_DEPLOYMENT_TARGET (default 10.13), and whisper.cpp's C++
      # (std::filesystem) needs >= 10.15 — dropping the field broke the first
      # moon-v0.0.22 release run with "'path' is unavailable" compile errors.
      # ASSIGN THE FIELD, DO NOT REPLACE THE OBJECT. This step used to do
      # `c.bundle.macOS = {signingIdentity, minimumSystemVersion}`, which
      # silently dropped hardenedRuntime AND entitlements, so every CI-built
      # release shipped with no entitlements.plist — codesign reported
      # `entitlements=none` and com.apple.security.device.audio-input was
      # absent, breaking mic/voice in released builds while local
      # `bun run install:macos` (which passes --entitlements) stayed fine.
      # test/macos-info-plist-network.test.ts executes this exact script and
      # asserts the fields survive.
      - name: Ad-hoc sign for CI (preserve every other macOS bundle field)
        working-directory: apps/ui-moon-tauri/src-tauri
        run: |
          node -e 'const fs=require("fs");const f="tauri.conf.json";const c=JSON.parse(fs.readFileSync(f,"utf8"));c.bundle.macOS.signingIdentity="-";fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n");console.log("CI macOS signing -> ad-hoc (-); preserved:",JSON.stringify({minimumSystemVersion:c.bundle.macOS.minimumSystemVersion,hardenedRuntime:c.bundle.macOS.hardenedRuntime,entitlements:c.bundle.macOS.entitlements}))'

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/ui-moon-tauri
          # steps.tag.outputs.name, not github.ref_name — on a workflow_dispatch
          # github.ref_name is the branch (master), not the moon-v* tag.
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "Luna Moon ${{ steps.tag.outputs.name }}"
          # MUST be false/false — a draft or prerelease makes the
          # releases/latest/download/latest.json endpoint 404, so the updater
          # would silently never find an update.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      # Belt-and-suspenders: tauri-action SHOULD mark the new release as latest,
      # but historically a non-Moon release (e.g. chat-v0.12b) cut between Moon
      # releases stole the "Latest" flag and broke the updater endpoint
      # (HTTP 200 but JSON for the wrong release ⇒ "could not fetch valid
      # release JSON"). This step re-anchors latest to THIS Moon release as
      # the final action of the workflow. See RELEASES.md "latest invariant".
      - name: Re-anchor 'Latest' flag to this Moon release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release edit "${{ steps.tag.outputs.name }}" --latest --repo "${{ github.repository }}"
